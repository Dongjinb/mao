  document.getElementById('md-water').addEventListener('click',changeWater);
  var sfxBtn=document.getElementById('md-sfx');
  sfxBtn.addEventListener('click',function(){
    sfxOn=!sfxOn;
    try{localStorage.setItem('meow-diary-sfx',sfxOn?'1':'0');}catch(e){}
    sfxBtn.textContent=sfxOn?'🔊':'🔇';
  var bgmBtn=document.getElementById('md-bgm');
  try{if(localStorage.getItem('meow-diary-bgm')==='1')setTimeout(function(){bgmStart();bgmBtn.textContent='🎵';},600);}catch(e){}
  bgmBtn.textContent=(function(){try{return localStorage.getItem('meow-diary-bgm')==='1'?'🎵':'🔕';}catch(e){return '🎵̸';}})();
  bgmBtn.addEventListener('click',function(){
    try{
      if(bgmOn){bgmStop();localStorage.setItem('meow-diary-bgm','0');bgmBtn.textContent='🔕';}
      else{bgmStart();localStorage.setItem('meow-diary-bgm','1');bgmBtn.textContent='🎵';}
    }catch(e){}
  });
    if(sfxOn)sfx('click');
  });
  sfxBtn.textContent=sfxOn?'🔊':'🔇';
  var bgmBtn=document.getElementById('md-bgm');
  try{if(localStorage.getItem('meow-diary-bgm')==='1')setTimeout(function(){bgmStart();bgmBtn.textContent='🎵';},600);}catch(e){}
  bgmBtn.textContent=(function(){try{return localStorage.getItem('meow-diary-bgm')==='1'?'🎵':'🔕';}catch(e){return '🎵̸';}})();
  bgmBtn.addEventListener('click',function(){
    try{
      if(bgmOn){bgmStop();localStorage.setItem('meow-diary-bgm','0');bgmBtn.textContent='🔕';}
      else{bgmStart();localStorage.setItem('meow-diary-bgm','1');bgmBtn.textContent='🎵';}
    }catch(e){}
  });
  document.getElementById('md-questchip').addEventListener('click',function(){document.getElementById('tab-quest').click();});
  var resetArmed=0;
  document.getElementById('md-reset').addEventListener('click',function(){
    var now=Date.now();
    if(now-resetArmed<3000){
      try{localStorage.removeItem(SAVE_KEY);}catch(e){}
      S=freshState();parts.length=0;fish.on=false;fishBox.hidden=true;
      this.textContent='重新开始';
      toast('🏠 已重新开始！');
      save();
    }else{
      resetArmed=now;
      this.textContent='再点一次确认重置';
      var b=this;setTimeout(function(){b.textContent='重新开始';},3000);
    }
  });

  /* ================= 画布交互 ================= */
  function resize(){
    var w=canvas.clientWidth||900;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(w*(LH/LW)*dpr);
    pxScale=canvas.width/LW;
  }
  if(window.ResizeObserver)new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize',resize);
  function toLogical(e){
    var r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH};
  }
  function topCatAt(x,y){
    var best=null;
    for(var i=0;i<S.cats.length;i++){
      var c=S.cats[i],s=scaleOf(c);
      var hTop=(c.state==='sleep'||c.state==='sick')?44:82;
      if(Math.abs(x-c.x)<=60*s&&y>c.y-hTop*s&&y<c.y+10){if(!best||c.y>best.y)best=c;}
    }
    return best;
  }
  var pDown=false,pDownX=0,pDownY_global=0,pDownCam=0,pDrag=0,activePointerId=null;
  var grabCat=null,grabMoved=false,grabDX=0,grabDY=0,dragPointer={x:0,y:0},edgeHintT=0,edgeDir=0;
  canvas.addEventListener('pointerdown',function(e){
    pDown=true;pDownX=e.clientX;pDownY_global=e.clientY;pDownCam=camTarget;pDrag=0;grabMoved=false;
    activePointerId=e.pointerId;
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
    var r=canvas.getBoundingClientRect();
    var p={x:(e.clientX-r.left)/r.width*LW+camX,y:(e.clientY-r.top)/r.height*LH};
    if(!fish.on){
      var c=topCatAt(p.x,p.y);
      if(c&&!c.dying){grabCat=c;grabDX=c.x-p.x;grabDY=c.y-p.y;}
      else grabCat=null;
    }else grabCat=null;
  });
  window.addEventListener('pointermove',function(e){
    var r=canvas.getBoundingClientRect();
    var p={x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH};
    if(pDown&&(e.pointerType==="touch"||e.pointerType==="pen"||e.buttons>0)){
      var dx=(e.clientX-pDownX)*(LW/r.width);
      pDrag=Math.max(pDrag,Math.abs(dx));
      if(grabCat){
        // 抱起小猫：跟随指针移动
        if(Math.abs(e.clientX-pDownX)>9||Math.abs(e.clientY-pDownY_global)>9)grabMoved=true;
        if(grabMoved){
          grabCat.held=true;
          grabCat.state='held';
          dragPointer.x=p.x;
          dragPointer.y=p.y;
          grabCat.x=clamp(p.x+camX+grabDX,40,2700);
          grabCat.y=clamp(p.y+grabDY,240,510);
          canvas.style.cursor='grabbing';
          return;
        }
      }
      camTarget=clamp(pDownCam-dx,0,CFG.world.w-LW);
      canvas.style.cursor='grabbing';
      return;
    }
    var c=topCatAt(p.x+camX,p.y);
    hoverId=c?c.id:null;
    canvas.style.cursor=c?'pointer':(inFacility(p.x+camX,p.y)?'pointer':'default');
  });
  window.addEventListener('pointerup',function(e){
    if(!pDown)return;
    pDown=false;
    try{if(activePointerId!=null)canvas.releasePointerCapture(activePointerId);}catch(err){}
    activePointerId=null;
    if(grabCat&&grabMoved){
      var gc=grabCat;grabCat=null;grabMoved=false;
      gc.held=false;gc.state='idle';gc.animT=0;gc.idleT=rnd(1,2.5);
      gc.x=clamp(gc.x,40,2700);gc.y=clamp(gc.y,240,510);
      // 丢到澡盆上 → 直接洗澡
      if(Math.abs(gc.x-BATH.x)<80&&Math.abs(gc.y-BATH.y)<70){
        bathCat(gc,true);
      }else{
        bubble(gc,'喵~');
        sfx('meow');
      }
      save();
      return;
    }
    grabCat=null;
    if(Math.abs(e.clientX-pDownX)>12||Math.abs(e.clientY-pDownY_global)>12)return;
    var r=canvas.getBoundingClientRect();
    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
    var p={x:(e.clientX-r.left)/r.width*LW+camX,y:(e.clientY-r.top)/r.height*LH};
    if(fish.on)return;
    if(p.x>30&&p.x<125&&p.y>85&&p.y<200){
      if(S.inventory.brandFoodBag>0)refillFood('brand');
      else if(S.inventory.cheapFoodBag>0)refillFood('cheap');
      else toast('猫粮器没粮了，去商城买猫粮');
      return;
    }
    if(Math.abs(p.x-BATH.x)<52&&p.y>BATH.y-40&&p.y<BATH.y+30){
      var cand=dirtiestBathCandidate();
      if(cand)bathCat(cand,true);
      else toast('暂时没有能洗澡的小猫（生病/濒死的猫要先去医院）');
      return;
    }
    if(Math.abs(p.x-WBOWL.x)<40&&p.y>460){changeWater();return;}
    if(Math.abs(p.x-LITTER.x)<70&&p.y>440){scoopLitter();return;}
    var c=topCatAt(p.x,p.y);
    if(!c){S.selected=null;buildChips.sig='';return;}
    if(S.selected===c.id)petCat(c);
    else{S.selected=c.id;buildChips.sig='';bubble(c,'喵~');}
  });
  window.addEventListener('pointercancel',function(e){
    if(!pDown&&!grabCat)return;
    pDown=false;
    if(grabCat){
      var gc=grabCat;grabCat=null;grabMoved=false;
      gc.held=false;gc.state='idle';gc.animT=0;
      gc.x=clamp(gc.x,40,2700);gc.y=clamp(gc.y,240,510);
      bubble(gc,'喵~');
      save();
    }
    try{if(activePointerId!=null)canvas.releasePointerCapture(activePointerId);}catch(err){}
    activePointerId=null;
  });
  canvas.addEventListener('wheel',function(e){
    if(fish.on)return;
    e.preventDefault();
    var r=canvas.getBoundingClientRect();
    var d=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*(LW/r.width);
    camTarget=clamp(camTarget+d,0,CFG.world.w-LW);
  },{passive:false});
  function inFacility(x,y){
    return (x>30&&x<125&&y>85&&y<200)||(Math.abs(x-WBOWL.x)<40&&y>460)||(Math.abs(x-LITTER.x)<70&&y>440);
  }

  /* ================= 调试钩子（测试用） ================= */
  window.__mdInfo=function(){return {
    day:S.day,season:seasonOf(S.day),weather:S.weather,coins:Math.floor(S.coins),
    food:Math.floor(S.facilities.food.brandUnits+S.facilities.food.cheapUnits),
    litter:{clean:Math.round(S.facilities.litter.clean),dss:S.facilities.litter.daysSinceScoop,dsc:S.facilities.litter.daysSinceChange},
    water:{dsc:S.facilities.water.daysSinceChange,dirty:waterDirty()},
    scratch:S.humanScratch,fish:S.daily.fishRounds,inv:S.inventory,felt:feltOpen(),
    cats:S.cats.map(function(c){return {id:c.id,name:c.name,gender:c.gender,personality:c.personality,stage:stageOf(c.ageDays),ageDays:c.ageDays,
      hunger:Math.round(stat100(c.hunger,0)),water:Math.round(stat100(c.water,0)),mood:Math.round(stat100(c.mood,0)),clean:Math.round(stat100(c.clean,0)),health:Math.round(stat100(c.health,0)),
      favor:Math.round(c.favor),hostility:Math.round(c.hostility),sick:c.sick,dying:c.dying,pregnant:c.pregnant,
      preg:c.pregnancyDays,lact:c.lactationDays,cool:c.cooldownDays,vacc:c.adultVaccine,state:c.state,treats:c.treatsToday,fur:c.furToday,x:Math.round(c.x),y:Math.round(c.y),held:!!c.held};}),
    titles:{current:S.titles.current,unlocked:S.titles.unlocked.slice(),totalFavor:totalFavor()}
  };};
  window.__mdGive=function(k,n){S.inventory[k]=(S.inventory[k]||0)+n;};
  window.__mdForce=function(zone,weather,dayFrac){S.weather=weather;camX=zone*920;camTarget=zone*920;if(dayFrac!=null)S.timeSec=(S.day-1)*CFG.secPerDay+dayFrac*CFG.secPerDay;draw();uiTick();return true;};
  window.__mdFixAll=function(keepSick){for(var i=0;i<S.cats.length;i++){var c=S.cats[i];c.hunger=100;c.water=100;c.mood=100;c.clean=100;c.health=Math.max(stat100(c.health,100),70);c.adultVaccine=true;c.dying=false;if(!keepSick)c.sick=false;}};
  window.__mdCam=function(){return {camX:camX,camTarget:camTarget};};
  window.__mdDo=function(a){if(a==='scoop')scoopLitter();else if(a==='water')changeWater();else if(a==='pet'&&S.cats[0])petCat(S.cats[0]);};
  window.__mdSetCam=function(v){camTarget=v;camX=v;};
  window.__mdTime=function(f){S.timeSec=(S.day-1)*CFG.secPerDay+f*CFG.secPerDay;};
  window.__mdCoins=function(n){S.coins+=n;};
  window.__mdGive=function(key,n){if(key==='favor'){for(var i=0;i<S.cats.length;i++)S.cats[i].favor=n;return;}S.inventory[key]=(S.inventory[key]||0)+n;};
  window.__mdSkip=function(n){for(var i=0;i<n;i++){S.timeSec+=CFG.secPerDay;settleDay();}};
  window.__mdQ=function(){return {quests:S.daily.quests,date:S.daily.questSeason,day:S.day};};
  window.__mdGrass=function(){S.grass={stage:2,plantedAt:T-999,bites:CFG.catgrass.bites};};

  /* ================= 主循环 ================= */
  S=load()||freshState();
  S.weather=S.weather||pickWeather(seasonOf(S.day));
  resize();
  var last=performance.now();
  function frame(now){
    try{
      frameInner(now);
    }catch(err){
      window.__frameErr=(err&&err.stack)||String(err);
      window.__frameErrCount=(window.__frameErrCount||0)+1;
      if(window.__frameErrCount<4)console.error('FRAME ERROR',err);
      // 异常时也要续帧，避免整个游戏冻住
      try{requestAnimationFrame(frame);}catch(e){}
    }
  }
  function frameInner(now){
    var dt=Math.min(0.1,(now-last)/1000);
    last=now;
    T+=dt;
    S.timeSec+=dt;
    var grabbingNow=grabCat&&grabMoved;
    if(grabbingNow){
      // 拖到画面左右边缘 → 镜头持续推进，实现跨房间搬运
      var EDGE=90, PAN=760;
      var depth=0;
      if(dragPointer.x<EDGE)depth=-(EDGE-dragPointer.x)/EDGE;
      else if(dragPointer.x>LW-EDGE)depth=(dragPointer.x-(LW-EDGE))/EDGE;
      if(depth!==0){
        camTarget=clamp(camTarget+depth*PAN*dt,0,CFG.world.w-LW);
        edgeHintT=0.6;edgeDir=depth>0?1:-1;
      }
      // 拖拽时相机即时跟随，猫保持粘在指针上
      camX=camTarget;
      grabCat.x=clamp(dragPointer.x+camX+grabDX,40,2700);
      grabCat.y=clamp(dragPointer.y+grabDY,240,510);
      if(edgeHintT>0)edgeHintT-=dt;
    }else{
      camTarget=clamp(camTarget,0,CFG.world.w-LW);
      camX+=(camTarget-camX)*Math.min(1,dt*8);
      if(Math.abs(camTarget-camX)<0.5)camX=camTarget;
      if(edgeHintT>0)edgeHintT-=dt;
    }
    // 跨天结算
    var dayNow=Math.floor(S.timeSec/CFG.secPerDay)+1;
    while(S.day<dayNow)settleDay();
    questDayT-=dt;
    if(questDayT<=0){
      questDayT=3;
      if(ensureQuestsBySeason(S)){
        S.daily.fishRounds=CFG.fishing.roundsPerSeason;
        toast('📋 新季度开始（'+seasonNameOf(S.day)+'）！季度任务与抓鱼次数已刷新');
        save();
      }
    }
    updateCats(dt);
    updateWorld(dt);
    updateWool(dt);
    updateFish(dt);
    updateParticles(dt);
    draw();
    saveT-=dt;
    if(saveT<=0){saveT=10;save();}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(uiTick,300);
  uiTick();
  if(S.timeSec<3)setTimeout(function(){toast('🏡 欢迎来到喵屋日记！先去游乐园抓鱼赚猫币吧～');},500);
  if(window.innerWidth<560&&window.innerHeight>window.innerWidth){
    setTimeout(function(){toast('📱 横屏或放大屏幕玩起来更顺手');},2600);
  }
  window.addEventListener('beforeunload',save);
  })();
  </script>
</div>
