<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵屋日记 · 养猫经营</title>
<style>:root{--background:#f6f3ee;--foreground:#3d3733;--card:#ffffff;--card-foreground:#3d3733;--popover:#ffffff;--popover-foreground:#3d3733;--primary:#e8912d;--primary-foreground:#fff;--muted:#efe9e1;--muted-foreground:#8a8078;--border:#e2d9cd;--input:#e2d9cd;--accent:#F2C14E;--accent-foreground:#5a4a20;--destructive:#DE6A6A}
*{box-sizing:border-box}
body{margin:0;padding:16px 12px;background:var(--background);color:var(--foreground);font:14px/1.5 system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
h4{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:10px;padding:4px 14px;font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.btn:hover:not(:disabled){border-color:#c9bda9;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover:not(:disabled){filter:brightness(1.05)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-xs{font-size:12px;padding:2px 8px;border-radius:8px}
.btn-sm{font-size:13px;padding:3px 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px}
.progress{background:var(--muted);border-radius:999px;height:12px;overflow:hidden}
.progress-bar{height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.cursor-interaction{cursor:pointer}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav-pills .nav-link{border:1px solid transparent;background:transparent;color:var(--muted-foreground);border-radius:999px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer}
.nav-pills .nav-link.active{background:var(--primary);color:var(--primary-foreground)}
.form-select{border:1px solid var(--input);background:var(--card);color:var(--foreground);border-radius:8px;padding:3px 8px;font:inherit;font-size:13px}
.form-select-sm{padding:2px 6px}
.text-small{font-size:12px}
.tabular-nums{font-variant-numeric:tabular-nums}</style>
</head>
<body>
<div id="meow-diary">
  <div class="md-top">
    <div class="md-title-row">
      <h3 class="md-title">🐱 喵屋日记</h3>
      <span class="md-stat" id="md-day">📅 第 1 天</span>
      <span class="md-stat" id="md-season">🌸 春</span>
      <span class="md-stat" id="md-weather">☀ 晴</span>
      <span class="md-stat" id="md-tod">☀ 白天</span>
      <span class="md-stat" id="md-cats">🐱 2/8</span>
      <span class="md-stat md-coins" id="md-coins">💰 500</span>
      <span class="md-stat md-title-chip" id="md-titlechip" hidden></span>
      <span class="md-stat" id="md-questchip" style="cursor:pointer"></span>
      <span class="md-stat md-warn" id="md-scratch" hidden>⚠ 被挠伤</span>
      <button class="btn btn-ghost btn-xs" id="md-bgm" type="button">🎵</button>
      <button class="btn btn-ghost btn-xs" id="md-sfx" type="button">🔊</button>
      <button class="btn btn-ghost btn-xs" id="md-reset" type="button">重新开始</button>
    </div>
  </div>

  <div class="md-stage">
    <canvas id="md-canvas" role="img" aria-label="猫屋画面：小猫们在这里生活"></canvas>
    <div class="md-toasts" id="md-toasts" aria-live="polite"></div>
    <div class="md-hint" id="md-hint"></div>
    <div class="md-game" id="md-fish" hidden>
      <div class="md-game-head">🎣 抓鱼 <span id="md-fish-time" class="tabular-nums">30</span>s 得分 <span id="md-fish-score" class="tabular-nums">0</span> <button class="btn btn-xs" id="md-fish-close" type="button">结束</button></div>
      <canvas id="md-fish-canvas" width="640" height="300"></canvas>
      <div class="md-fish-tip text-small">点鱼抓鱼：小鱼 2分 · 中鱼 5分 · 大鱼 10分 · 1分=1猫币</div>
    </div>
    <div class="md-game" id="md-wool" hidden>
      <div class="md-game-head">🧺 接猫毛 <span id="md-wool-time" class="tabular-nums">25</span>s · 接到 <span id="md-wool-score" class="tabular-nums">0</span> 个 <button class="btn btn-xs" id="md-wool-close" type="button">结束</button></div>
      <canvas id="md-wool-canvas" width="640" height="320"></canvas>
      <div class="md-fish-tip text-small">移动鼠标 / 手指左右拖动篮子接猫毛：白毛+1 · 金毛球+5 · 毛线团 -3（别接！）</div>
    </div>
    <div class="md-game" id="md-cookbar" hidden>
      <div class="md-game-head">🔪 刀工判定 <button class="btn btn-xs" id="md-cookbar-skip" type="button">直接做（普通品质）</button></div>
      <div class="md-cookbar-wrap" id="md-cookbar-wrap">
        <div class="md-cookbar-zone md-cookbar-zone-good"></div>
        <div class="md-cookbar-zone md-cookbar-zone-perfect"></div>
        <div class="md-cookbar-cursor" id="md-cookbar-cursor"></div>
      </div>
      <div class="md-fish-tip text-small">指针左右摆动 · 在<b>绿色区域</b>点击=完美刀工（金色猫饭）· 黄色=正常猫饭 · 其他=手滑</div>
    </div>
    <div class="md-game" id="md-m3" hidden>
      <div class="md-game-head">💎 消消乐 <span id="md-m3-score" class="tabular-nums">0</span>分 · 剩 <span id="md-m3-moves" class="tabular-nums">15</span> 步 <button class="btn btn-xs" id="md-m3-close" type="button">结束</button></div>
      <div class="md-m3-grid" id="md-m3-grid" aria-label="消消乐棋盘"></div>
      <div class="md-fish-tip text-small">点击相连的同种图标（≥2 个）消除 · ≥200 分得 1 颗猫草种子，≥500 得 2 颗</div>
    </div>
  </div>

  <div class="md-facility-row">
    <div class="md-scenes" id="md-scenes" role="group" aria-label="场景切换"></div>
    <button class="btn btn-sm" id="md-refill" type="button">🍚 补粮 <span class="md-dim" id="md-food-left"></span></button>
    <button class="btn btn-sm" id="md-scoop" type="button">🧹 铲屎 <span class="md-dim" id="md-litter-left"></span></button>
    <button class="btn btn-sm" id="md-water" type="button">💧 换水 <span class="md-dim" id="md-water-left"></span></button>
  </div>

  <div class="md-lower">
    <div class="md-main-col">
      <div class="nav nav-pills md-nav" role="tablist" aria-label="功能导航">
        <button class="nav-link active" id="tab-room" role="tab" aria-controls="panel-room" aria-selected="true" type="button">🏠 房间</button>
        <button class="nav-link" id="tab-shop" role="tab" aria-controls="panel-shop" aria-selected="false" type="button">🛒 商城</button>
        <button class="nav-link" id="tab-hospital" role="tab" aria-controls="panel-hospital" aria-selected="false" type="button">🏥 医院</button>
        <button class="nav-link" id="tab-play" role="tab" aria-controls="panel-play" aria-selected="false" type="button">🎣 游乐园</button>
        <button class="nav-link" id="tab-quest" role="tab" aria-controls="panel-quest" aria-selected="false" type="button">📋 任务</button>
        <button class="nav-link" id="tab-bag" role="tab" aria-controls="panel-bag" aria-selected="false" type="button">🎒 背包</button>
        <button class="nav-link" id="tab-title" role="tab" aria-controls="panel-title" aria-selected="false" type="button">🏅 称号</button>
      </div>
      <div class="md-panels">
        <div id="panel-room" role="tabpanel" aria-labelledby="tab-room">
          <div class="card md-panel" id="md-panel"></div>
        </div>
        <div id="panel-shop" role="tabpanel" aria-labelledby="tab-shop" hidden></div>
        <div id="panel-hospital" role="tabpanel" aria-labelledby="tab-hospital" hidden></div>
        <div id="panel-play" role="tabpanel" aria-labelledby="tab-play" hidden></div>
        <div id="panel-quest" role="tabpanel" aria-labelledby="tab-quest" hidden></div>
        <div id="panel-bag" role="tabpanel" aria-labelledby="tab-bag" hidden></div>
        <div id="panel-title" role="tabpanel" aria-labelledby="tab-title" hidden></div>
      </div>
    </div>
    <aside class="md-side">
      <div>
        <div class="md-side-title">🐱 猫咪</div>
        <div class="md-chips" id="md-chips" aria-label="猫咪快捷名单"></div>
      </div>
      <div class="md-log-wrap">
        <div class="md-side-title">📋 事件日志</div>
        <div class="md-log" id="md-log" aria-live="polite"></div>
      </div>
    </aside>
  </div>

  <style>
    /* ===== 布局骨架 ===== */
    #meow-diary{max-width:1060px;margin:0 auto;color:var(--foreground);font-size:14px;}
    /* 浮层 fixed 居中基准与内容一致（滚动条宽度差异会导致偏移） */
    #meow-diary .md-top{margin-bottom:8px;}
    #meow-diary .md-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
    #meow-diary .md-title{margin:0 6px 0 0;font-weight:500;}
    #meow-diary .md-stat{font-variant-numeric:tabular-nums;background:var(--muted);color:var(--muted-foreground);padding:3px 10px;border-radius:999px;font-size:13px;white-space:nowrap;}
    #meow-diary .md-coins{background:var(--primary);color:var(--primary-foreground);}
    #meow-diary .md-warn{background:var(--destructive,#DE6A6A);color:#fff;}
    #meow-diary .md-title-chip{background:var(--accent,#F2C14E);color:var(--accent-foreground,#5a4a20);}
    #meow-diary .md-stage{position:relative;}
    #meow-diary #md-canvas{display:block;width:100%;aspect-ratio:920/540;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.10);background:#F7E8D2;touch-action:none;-ms-touch-action:none;-webkit-user-select:none;user-select:none;}
    #meow-diary .md-toasts{position:absolute;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5;}
    #meow-diary .md-toast{background:var(--popover);color:var(--popover-foreground);padding:4px 14px;border-radius:999px;font-size:13px;opacity:0;transform:translateY(-8px);transition:opacity .3s,transform .3s;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:92%;}
    #meow-diary .md-toast.in{opacity:1;transform:none;}
    #meow-diary .md-toast.out{opacity:0;transform:translateY(-6px);}
    #meow-diary .md-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--popover);color:var(--popover-foreground);padding:4px 14px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .35s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
    #meow-diary .md-hint.show{opacity:.96;}
    #meow-diary .md-game{position:absolute;inset:0;background:var(--popover);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;z-index:6;overflow:hidden;}
    /* 消消乐浮层允许比画布高（手机上 7 行放不下），内容超出时内部滚动 */
    #meow-diary #md-m3{position:absolute;top:6px;bottom:auto;left:50%;transform:translateX(-50%);width:min(94%,380px);max-height:none;box-shadow:0 6px 18px rgba(0,0,0,.18);}
    #meow-diary #md-fish[hidden],#meow-diary #md-wool[hidden],#meow-diary #md-m3[hidden],#meow-diary #md-cookbar[hidden]{display:none !important;}
    #meow-diary .md-game-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;flex-wrap:wrap;justify-content:center;flex:0 0 auto;}
    #meow-diary #md-fish-canvas{width:100%;max-width:640px;border-radius:12px;background:#BFE3F2;cursor:crosshair;}
    #meow-diary #md-wool-canvas{width:100%;max-width:640px;border-radius:12px;background:#FDEFD8;cursor:none;touch-action:none;}
    #meow-diary .md-m3-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%;margin:0 auto;flex:0 0 auto;}
    #meow-diary .md-m3-grid button{width:100%;aspect-ratio:1/1;font-size:clamp(13px,3.4vw,20px);border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    #meow-diary .md-m3-grid button:hover{border-color:var(--primary);}
    #meow-diary .md-fish-tip{font-size:12px;color:var(--muted-foreground);text-align:center;max-width:620px;}
    #meow-diary .md-facility-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center;}
    #meow-diary .md-scenes{display:flex;gap:6px;margin-right:6px;}
    #meow-diary .md-lower{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(240px,1fr);gap:14px;align-items:start;}
    @media (max-width:760px){#meow-diary .md-lower{grid-template-columns:1fr;}}
    #meow-diary .md-nav{margin-bottom:10px;}
    #meow-diary .md-panels{min-height:120px;}
    #meow-diary .md-panel{padding:12px;margin-bottom:10px;}
    #meow-diary .md-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
    #meow-diary .md-chip{border:1px solid var(--border);background:var(--card);color:var(--card-foreground);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
    #meow-diary .md-chip.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
    #meow-diary .md-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;}
    #meow-diary .sex-m{color:#4C8BE0;font-weight:600;}
    #meow-diary .sex-f{color:#E8689C;font-weight:600;}
    #meow-diary .md-p-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
    #meow-diary .md-name{background:none;border:none;font:inherit;font-weight:600;color:var(--foreground);padding:0;cursor:pointer;text-decoration:underline dotted;}
    #meow-diary .md-ren{font:inherit;font-weight:600;width:72px;padding:1px 6px;border-radius:6px;border:1px solid var(--input);background:var(--background);color:var(--foreground);}
    #meow-diary .md-bar-row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:5px 0;}
    #meow-diary .md-bar-row .progress{height:10px;}
    #meow-diary .md-status{color:var(--muted-foreground);font-size:13px;margin:8px 0;}
    #meow-diary .md-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
    #meow-diary .md-empty{color:var(--muted-foreground);font-size:13px;}
    #meow-diary .md-dim{color:var(--muted-foreground);font-size:12px;font-weight:400;}
    #meow-diary .md-shop-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
    #meow-diary .md-shop-item:last-child{border-bottom:none;}
    #meow-diary .md-item-name{font-weight:500;min-width:100px;}
    #meow-diary .md-item-desc{color:var(--muted-foreground);font-size:12px;flex:1;min-width:170px;}
    #meow-diary .md-own{color:var(--muted-foreground);font-size:12px;min-width:56px;text-align:right;}
    #meow-diary .md-hp-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:13px;}
    #meow-diary .md-hp-row:last-child{border-bottom:none;}
    #meow-diary .md-badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--muted);color:var(--muted-foreground);}
    #meow-diary .md-badge.bad{background:var(--destructive,#DE6A6A);color:#fff;}
    #meow-diary .md-badge.good{background:#7FBF5A;color:#fff;}
    #meow-diary .md-ing-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0;}
    #meow-diary .md-play-card{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--card);}
    #meow-diary .md-play-card h4{margin:0 0 6px;font-weight:500;font-size:14px;}
    #meow-diary .md-grid{display:flex;gap:8px;flex-wrap:wrap;}
    #meow-diary .md-side{display:flex;flex-direction:column;gap:10px;}
    #meow-diary .md-side-title{font-size:13px;color:var(--muted-foreground);margin-bottom:4px;}
    #meow-diary .md-log-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
    #meow-diary .md-log{font-size:12px;color:var(--muted-foreground);display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;}
    /* 任务栏 */
    #meow-diary .md-quest-item{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card);}
    #meow-diary .md-quest-item.done{opacity:.55;}
    #meow-diary .md-quest-top{display:flex;align-items:center;gap:8px;}
    #meow-diary .md-quest-icon{font-size:16px;}
    #meow-diary .md-quest-name{font-weight:500;flex:1;}
    #meow-diary .md-quest-reward{color:#C99022;font-weight:600;font-size:13px;white-space:nowrap;}
    #meow-diary .md-quest-bar{height:8px;margin:7px 0 5px;}
    #meow-diary .md-quest-bottom{display:flex;align-items:center;gap:8px;justify-content:space-between;}
    #meow-diary .md-quest-head{font-size:12px;color:var(--muted-foreground);margin-bottom:10px;}
    /* 背包格子 */
    #meow-diary .md-bag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;}
    #meow-diary .md-bag-cell{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:8px 4px;text-align:center;position:relative;}
    #meow-diary .md-bag-cell.empty{opacity:.42;}
    #meow-diary .md-bag-emoji{font-size:22px;line-height:1.2;}
    #meow-diary .md-bag-name{font-size:11px;color:var(--muted-foreground);margin:2px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #meow-diary .md-bag-count{font-size:13px;font-weight:600;}
    #meow-diary .md-bag-cell .btn{margin-top:3px;}
    /* 猫饭判定条 */
    #meow-diary .md-cookbar-wrap{position:relative;width:100%;max-width:560px;height:52px;border-radius:12px;overflow:hidden;background:var(--muted);border:2px solid var(--border);}
    #meow-diary .md-cookbar-zone{position:absolute;top:0;bottom:0;}
    #meow-diary .md-cookbar-zone-good{left:24%;width:52%;background:rgba(242,193,78,.35);}
    #meow-diary .md-cookbar-zone-perfect{left:40%;width:20%;background:rgba(127,191,90,.55);}
    #meow-diary .md-cookbar-cursor{position:absolute;top:-2px;bottom:-2px;width:5px;background:var(--destructive,#DE6A6A);border-radius:3px;box-shadow:0 0 6px rgba(0,0,0,.35);left:0;}
    /* 毛毡工坊卡片 */
    #meow-diary .md-play-card.felt{background:linear-gradient(160deg,var(--card),rgba(224,196,158,.14));}
    #meow-diary .md-felt-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    #meow-diary .md-felt-title{font-weight:500;font-size:14px;}
    #meow-diary .md-felt-res{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
    #meow-diary .md-felt-chip{background:var(--muted);border-radius:999px;padding:3px 12px;font-size:13px;}
    #meow-diary .md-felt-chip b{color:var(--primary);}
    #meow-diary .md-felt-arrow{color:var(--muted-foreground);}
    #meow-diary .md-felt-note{font-size:11px;color:var(--muted-foreground);}
    #meow-diary .md-felt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
    #meow-diary .md-felt-crafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
    #meow-diary .md-felt-prod{border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;background:var(--card);}
    #meow-diary .md-felt-prod.ready{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}
    #meow-diary .md-felt-emoji{font-size:26px;}
    #meow-diary .md-felt-pname{font-size:13px;font-weight:500;margin:2px 0;}
    #meow-diary .md-felt-pmeta{font-size:11px;color:var(--muted-foreground);margin-bottom:6px;}
    #meow-diary .md-felt-btns{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
    @media (max-width:560px){
      #meow-diary .md-title{font-size:16px;}
      #meow-diary .md-stat{font-size:12px;padding:2px 8px;}

  function heartBurst(x,y,n){for(var i=0;i<n;i++)spawn('heart',x+rnd(-16,16),y+rnd(-8,8),{life:rnd(0.9,1.5),vy:rnd(-38,-22),size:rnd(3.5,5.5)});}

  /* ================= 音效（WebAudio 合成，无素材） ================= */
  var AC=null,sfxOn=true;
  try{sfxOn=localStorage.getItem('meow-diary-sfx')!=='0';}catch(e){}
  function beep(freq,dur,type,vol,slide){
    if(!sfxOn)return;
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended')AC.resume();
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq,AC.currentTime);
      if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);
      g.gain.setValueAtTime(vol||0.12,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
      o.connect(g);g.connect(AC.destination);
      o.start();o.stop(AC.currentTime+dur);
    }catch(e){}
  }
  /* ---- BGM：治愈系五声音阶琶音 ---- */
  var bgmOn=false,bgmTimer=null,bgmGain=null;
  // 欢快版：C 大调五声音阶（跳跃感更强，含高八度）
  var PENTA=[523.25,587.33,659.25,783.99,880.00,1046.50,1174.66,1318.51];
  // 明亮快活的进行：C -> G -> Am -> F（流行卡农式，明亮收尾）
  var PROG=[
    {root:130.81,chord:[261.63,329.63,392.00]},
    {root:98.00,chord:[293.66,392.00,493.88]},
    {root:110.00,chord:[261.63,329.63,440.00]},
    {root:87.31,chord:[261.63,349.23,440.00]}
  ];
  var progIdx=0;
  // 轻快的小音符序列（每小节一个动机，带休止和跳进）
  var MOTIFS=[
    [0,2,4,2],[4,5,4,2],[0,2,3,5],[5,3,2,0],
    [0,4,5,7],[2,4,2,0],[4,7,5,3],[0,3,5,4]
  ];
  function bgmVoice(freq,dur,delay,type,vol){
    try{
      var t0=AC.currentTime+delay;
      var o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.setValueAtTime(freq,t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(vol,t0+0.045);
      g.gain.linearRampToValueAtTime(vol*0.62,t0+Math.min(dur*0.55,0.45));
      g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      o.connect(g);g.connect(bgmGain);
      o.start(t0);o.stop(t0+dur+0.1);
    }catch(e){}
  }
  function bgmBar(){
    if(!bgmOn)return;
    var ch=PROG[progIdx%PROG.length];
    progIdx++;
    // 低音拨弦（短促有力）+ 和弦跳音（轻快）
    bgmVoice(ch.root,1.1,0,'triangle',0.070);
    bgmVoice(ch.root*2,0.9,1.6,'triangle',0.045);
    for(var k=0;k<ch.chord.length;k++){
      bgmVoice(ch.chord[k]*2,1.2,0.06+k*0.02,'sine',0.026);
      bgmVoice(ch.chord[k]*2,1.0,3.0+k*0.02,'sine',0.021);
    }
    // 主旋律：8 分音符左右的密集跳音，有休止，明快
    var motif=MOTIFS[progIdx%MOTIFS.length];
    var tAcc=0.30;
    for(var i=0;i<motif.length;i++){
      var f=PENTA[clamp(motif[i],0,PENTA.length-1)];
      bgmVoice(f,0.95,tAcc,'triangle',0.052);
      // 偶尔加高八度点缀
      if(Math.random()<0.22)bgmVoice(f*2,0.6,tAcc+0.06,'sine',0.020);
      tAcc+=0.62;
    }
    // 反拍轻敲（沙锤感）
    for(var s2=0;s2<4;s2++){
      bgmVoice(ch.chord[s2%ch.chord.length]*4,0.16,s2*1.55+1.24,'sine',0.013);
    }
  }
  function bgmStart(){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended')AC.resume();
      bgmGain=AC.createGain();bgmGain.gain.value=0.9;
      // 低通滤波，去掉刺耳高频，更"治愈"
      try{
        var lp=AC.createBiquadFilter();
        lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=0.5;
        bgmGain.disconnect();
        bgmGain.connect(lp);lp.connect(AC.destination);
      }catch(e){bgmGain.connect(AC.destination);}
      bgmOn=true;
      bgmBar();
      bgmTimer=setInterval(bgmBar,4400);
    }catch(e){}
  }
  function bgmStop(){
    bgmOn=false;
    if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}
    try{if(bgmGain){bgmGain.disconnect();bgmGain=null;}}catch(e){}
  }
  function sfx(kind){
    if(kind==='coin')beep(880,0.14,'triangle',0.10,1318);
    else if(kind==='click')beep(520,0.06,'square',0.05);
    else if(kind==='meow')beep(620,0.28,'sawtooth',0.06,320);
    else if(kind==='pop')beep(320,0.1,'sine',0.14,640);
    else if(kind==='hiss')beep(240,0.2,'sawtooth',0.05,140);
    else if(kind==='success'){beep(660,0.1,'triangle',0.09);setTimeout(function(){beep(880,0.1,'triangle',0.09);},100);setTimeout(function(){beep(1100,0.16,'triangle',0.09);},200);}
  }

  /* ================= 每日任务 ================= */
  function todayKey(){
    var d=new Date();
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  }
  // 自然天（现实日期）变化时才换任务
  function ensureQuestsByRealDay(st){
    var k=todayKey();
    if(!st.daily.quests||!st.daily.quests.length||st.daily.questDate!==k){
      st.daily.questDate=k;
      genQuests(st);
      return true;
    }
    return false;
  }
  function gameSeasonIdx(day){
    return Math.floor((day-1)/CFG.quests.daysPerSeason);
  }
  function seasonNameOf(day){
    var s=CFG.SEASONS[gameSeasonIdx(day)%4];
    return CFG.SEASON_ICON[s]+' '+CFG.SEASON_LABEL[s];
  }
  function genQuests(st){
    var pool=CFG.quests.pool.slice();
    st.daily.quests=[];
    for(var i=0;i<CFG.quests.perSeason&&pool.length;i++){
      var q=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
      st.daily.quests.push({id:q.id,name:q.name,key:q.key,target:q.target,reward:q.reward,progress:0,claimed:false});
    }
    st.daily.questSeason=gameSeasonIdx(st.day);
  }
  function ensureQuestsBySeason(st){
    var w=gameSeasonIdx(st.day);
    if(!st.daily.quests||!st.daily.quests.length||st.daily.questSeason!==w){
      genQuests(st);
      return true;
    }
    return false;
  }
  function bumpQuest(key,amount){
    var qs=S.daily.quests||[];
    var inc=amount||1;
    for(var i=0;i<qs.length;i++){
      var q=qs[i];
      if(q.key===key&&!q.claimed&&q.progress<q.target){
        q.progress=Math.min(q.target,q.progress+inc);
        if(q.progress>=q.target)toast('📋 任务完成：'+q.name+'（游乐园领取 '+q.reward+' 猫币）');
      }
    }
  }

  /* ================= 每日结算（跨天） ================= */
  function waterDirty(){return S.facilities.water.daysSinceChange>=CFG.stats.waterDirtyAfterDays;}
  function litterFull(){return S.facilities.litter.daysSinceScoop>=CFG.stats.litter.capacityDays;}

  function pickWeather(season){
    var r=Math.random();
    if(season==='winter')return r<0.4?'sunny':(r<0.7?'cloudy':'snow');
    if(season==='summer')return r<0.5?'sunny':(r<0.8?'cloudy':'rain');
    return r<0.45?'sunny':(r<0.75?'cloudy':'rain');
  }

  function totalFavor(){var s=0;for(var i=0;i<S.cats.length;i++)s+=S.cats[i].favor;return s;}
  function titleIncomePerDay(){
    if(!S.titles.current)return 0;
    for(var i=0;i<CFG.titles.length;i++)if(CFG.titles[i].id===S.titles.current)return CFG.titles[i].income;
    return 0;
  }

  function settleDay(){
    S.day++;
    var season=seasonOf(S.day);
    S.weather=pickWeather(season);
    var ti=titleIncomePerDay();
    if(ti>0){S.coins+=ti;log('称号「'+currentTitleName()+'」收益 +'+ti+' 猫币');}
    // 抓鱼按季度刷新；接猫毛按游戏天刷新
    if(S.daily.woolDay!==S.day){S.daily.woolDay=S.day;S.daily.woolRounds=CFG.wool.roundsPerDay;}

    // 设施老化
    var F=S.facilities;
    F.litter.daysSinceScoop++;
    F.litter.daysSinceChange++;
    F.water.daysSinceChange++;
    // 猫砂自然变脏：每天 -12，满盆（3 天没铲）再额外 -20
    F.litter.clean=clamp(F.litter.clean-12,0,100);
    if(F.litter.daysSinceScoop>=CFG.stats.litter.capacityDays)F.litter.clean=clamp(F.litter.clean-CFG.stats.litter.fullCleanPenalty,0,100);
    var wDirty=waterDirty(), lFull=litterFull();
    if(wDirty)log('水盆脏了，猫猫们喝不了水');
    if(lFull)log('猫砂盆满了！猫猫拒绝上厕所');

    // 人疫苗逾期
    if(S.humanScratch&&S.day>S.humanScratch.deadlineDay){
      S.coins=Math.max(0,S.coins-CFG.hospital.humanOverdueCoins);
      log('⚠ 人疫苗逾期！罚款 '+CFG.hospital.humanOverdueCoins+' 猫币，全部猫健康 -'+CFG.hospital.humanOverdueHealth);
      for(var i=0;i<S.cats.length;i++)S.cats[i].health=clamp(S.cats[i].health-CFG.hospital.humanOverdueHealth,0,100);
      S.humanScratch=null;
    }

    var deaths=[], births=[], nursingMoms={};
    var toys=F.toys, hasBed=toys.bed&&toys.bed.dur>0, hasTree=toys.tree&&toys.tree.dur>0;

    repairCats();
    for(var ci=0;ci<S.cats.length;ci++){
      var c=S.cats[ci];
      var st=stageOf(c.ageDays), prevStage=st;
      c.ageDays++;
      st=stageOf(c.ageDays);
      if(st!==prevStage){
        if(st==='teen')log(c.name+' 长成少年，开始吃猫粮啦');
        if(st==='adult')toast('🎉 '+c.name+' 成年了！记得去打疫苗（400 猫币）');
        if(st==='elder')toast('🍂 '+c.name+' 步入老年，更容易生病');
      }

      // 哺乳期母猫 & 幼猫
      var isKitten=st==='kitten';
      if(c.pregnant){
        c.pregnancyDays++;
        if(c.pregnancyDays>=CFG.breeding.pregDays){
          c.pregnant=false; c.lactationDays=CFG.breeding.lactDays;
          births.push(c);
        }
      }else if(c.lactationDays>0){
        c.lactationDays--;
        if(c.lactationDays===0){c.cooldownDays=CFG.breeding.coolDays;log(c.name+' 结束哺乳');}
      }else if(c.cooldownDays>0){
        c.cooldownDays--;
      }

      if(isKitten){
        var mother=null;
        if(c.parents[0])mother=catById(c.parents[0]);
        if(!mother&&c.parents[1])mother=catById(c.parents[1]);
        var nursing=mother&&mother.lactationDays>0;
        if(nursing){c.hunger=clamp(c.hunger+CFG.stats.kitten.nurseGain,0,100);c.mood=clamp(c.mood+5,0,100);nursingMoms[mother.id]=1;}
        else{c.hunger=clamp(c.hunger-CFG.stats.kitten.orphanHunger,0,100);c.health=clamp(c.health-CFG.stats.kitten.orphanHealth,0,100);}
      }else{
        c.hunger=clamp(c.hunger-(season==='summer'?CFG.stats.hungerPerDay.summer:CFG.stats.hungerPerDay.base),0,100);
      }

      // 水
      if(wDirty){c.health=clamp(c.health-CFG.stats.health.waterDirty,0,100);c.clean=clamp(c.clean-CFG.stats.cleanWaterPenalty,0,100);}
      else c.water=100;
      c.water=clamp(c.water-CFG.stats.waterPerDay,0,100);
      if(!wDirty)c.water=100;

      // 心情
      var mDrop=st==='teen'?CFG.stats.moodPerDay.teen:CFG.stats.moodPerDay.base;
      c.mood=clamp(c.mood-mDrop,0,100);
      if(c.personality==='introvert'&&!c.interacted)c.mood=clamp(c.mood+CFG.stats.introvertQuietGain,0,100);
      if(lFull)c.mood=clamp(c.mood-CFG.stats.litter.fullMoodPenalty,0,100);
      if(hasTree)c.mood=clamp(c.mood+CFG.stats.treeMood,0,100);
      if(hasBed)c.mood=clamp(c.mood+CFG.stats.bedSleepMood,0,100);

      // 清洁
      if(F.litter.daysSinceScoop>=1)c.clean=clamp(c.clean-CFG.stats.cleanLitterPenalty,0,100);
      if(lFull)c.clean=clamp(c.clean-CFG.stats.litter.fullCleanPenalty,0,100);

      // 拉肚子持续
      if(c.diarrheaDays>0)c.diarrheaDays--;

      // 健康
      if(c.hunger<=0)c.health=clamp(c.health-CFG.stats.health.hungerZero,0,100);
      if(c.clean<CFG.stats.cleanLowThreshold)c.health=clamp(c.health-CFG.stats.health.cleanLow,0,100);
      if(c.sick)c.health=clamp(c.health-CFG.stats.health.sick,0,100);
      // 生病自愈：健康越好越容易扛过去
      if(c.sick){
        var healChance=(CFG.stats.selfHealBase||0.12)+(c.health/100)*(CFG.stats.selfHealHealthFactor||0.16);
        if(Math.random()<healChance){
          c.sick=false;c.diarrheaDays=0;c.vomitToday=false;
          S.logs.unshift('第'+S.day+'天 '+c.name+' 自己扛过来了（病好了）');
          if(S.logs.length>40)S.logs.length=40;
          toast('💚 '+c.name+' 自己扛过来了，病好了！');
        }
      }

      // 生病判定
      if(!c.sick){
        var chance=0;
        if(c.health<CFG.stats.health.lowHealthThreshold)chance+=CFG.stats.health.sickChanceLowHealth;
        if(st==='adult'&&!c.adultVaccine)chance+=CFG.stats.health.unvaccAdult;
        if(st==='elder')chance+=CFG.stats.health.elderExtra;
        if(c.inbred)chance+=CFG.stats.health.inbredExtra;
        if(isDewormOverdue(c))chance+=CFG.stats.health.elderExtra;
        if(chance>0&&Math.random()<chance){
          c.sick=true; toIdle(c);
          log('🤢 '+c.name+' 生病了！去医院治病（200 猫币）');
          toast('🤢 '+c.name+' 生病了！');
        }
      }
      if(c.sick&&Math.random()<0.2)c.vomitToday=true;

      // 濒死 & 死亡
      if(c.health<=0&&!c.dying){c.dying=true;c.deadlineDay=S.day+CFG.stats.nearDeathDays;toIdle(c);toast('⚠ '+c.name+' 濒死！24 游戏小时内急救（500 猫币）');log(c.name+' 濒死！');}
      if(c.dying&&S.day>=c.deadlineDay){deaths.push({c:c,reason:'救治无效'});}
      else if(c.ageDays>=CFG.lifespanDays){deaths.push({c:c,reason:'寿终正眠（'+Math.floor(c.ageDays/CFG.daysPerYear)+'岁）'});}

      // 指甲过长：磨玩具耐久
      if(c.nailDays!=null){
        c.nailDays++;
        if(c.nailDays>CFG.care.nailDays){
          var toysDict=S.facilities.toys;
          for(var tk in toysDict){
            var toyDef=null;
            for(var ti2=0;ti2<CFG.toys.length;ti2++)if(CFG.toys[ti2].id===tk)toyDef=CFG.toys[ti2];
            if(toyDef&&toyDef.id!=='tree')toysDict[tk].dur=Math.max(0,toysDict[tk].dur-CFG.care.nailToyDamage);
          }
          if(!c._nailWarned){c._nailWarned=true;toast('💅 '+c.name+' 指甲太长了，正在磨坏玩具（房间面板可剪指甲）');}
        }
      }
      // 驱虫：超期痒 → 生病概率翻倍提示
      if(c.wormDays!=null)c.wormDays++;
      if(c.wormSeason==null)c.wormSeason=-1;

      // 每日计数复位
      c.treatsToday=0; c.furToday=0; c.interacted=false; c.brandToday=false;
      c.lastInteractReal=0; c.livelyWindows=0; c.shownVomit=false;
    }

    // 哺乳母猫额外消耗
    for(var nm in nursingMoms){
      var mc=catById(parseInt(nm,10));
      if(mc)mc.hunger=clamp(mc.hunger-CFG.stats.kitten.motherExtraHunger,0,100);
    }

    // 出生
    for(var b=0;b<births.length;b++){
      var mom=births[b];
      var room=CFG.catLimit-S.cats.length;
      var r=Math.random(),n=room<=0?0:(r<CFG.breeding.kittens[0]?1:(r<CFG.breeding.kittens[0]+CFG.breeding.kittens[1]?2:(room>=2?3:1)));
      if(room===1)n=1;
      var daddy=catById(mom.lastMate||'');
      for(var k=0;k<n;k++){
        var rr=Math.random(),coat;
        if(daddy&&rr<0.4)coat=mom.coat;
        else if(daddy&&rr<0.7)coat=daddy.coat;
        else coat=pick(COAT_IDS);
        var used=S.cats.map(function(x){return x.name;});
        var pool=NAMES.filter(function(nm){return used.indexOf(nm)<0;});
        var lin=[mom.id].concat(mom.parents?mom.parents:[]);
        if(daddy)lin=lin.concat([daddy.id],daddy.parents||[]);
        S.cats.push(makeCat({
          name:pool.length?pick(pool):('小猫'+(S.cats.length+1)),
          gender:Math.random()<0.5?'M':'F',coat:coat,ageDays:0,
          hunger:80,water:90,mood:85,clean:95,health:100,favor:CFG.favorInit,wormSeason:gameSeasonIdx(S.day),
          parents:[mom.id,daddy?daddy.id:null].filter(Boolean),
          lineage:lin.slice(0,6),
          x:clamp(mom.x+rnd(-46,46),80,2680),y:clamp(mom.y+rnd(-6,10),245,505)
        }));
      }
      if(n>0){toast('🎂 '+mom.name+' 生下了 '+n+' 只小猫！');log(mom.name+' 生了 '+n+' 只小猫');heartBurst(mom.x,mom.y-60,8);}
      else log(mom.name+' 生产了，但猫屋已满，小猫送养了');
    }

    // 死亡移除
    for(var di=0;di<deaths.length;di++){
      var dc=deaths[di].c;
      S.cats=S.cats.filter(function(x){return x.id!==dc.id;});
      if(S.selected===dc.id)S.selected=null;
      toast('💔 '+dc.name+' 离开了…（'+deaths[di].reason+'）');
      log(dc.name+' 去世：'+deaths[di].reason);
    }

    // 繁殖判定（每日 3%，春季×1.8）
    if(S.cats.length<CFG.catLimit){
      var males=S.cats.filter(function(c){return c.gender==='M'&&stageOf(c.ageDays)==='adult'&&c.adultVaccine&&c.health>CFG.breeding.minHealth&&c.mood>CFG.breeding.minMood&&c.favor>CFG.breeding.minFavor;});
      var fems=S.cats.filter(function(c){return c.gender==='F'&&stageOf(c.ageDays)==='adult'&&c.adultVaccine&&!c.pregnant&&c.lactationDays<=0&&c.cooldownDays<=0&&c.health>CFG.breeding.minHealth&&c.mood>CFG.breeding.minMood&&c.favor>CFG.breeding.minFavor;});
      var chance=CFG.breeding.chance*(season==='spring'?CFG.breeding.springMult:1);
      outer:
      for(var mi=0;mi<males.length;mi++)for(var fi=0;fi<fems.length;fi++){
        if(inbred(males[mi],fems[fi]))continue;
        if(Math.random()<chance){
          var m=males[mi],f=fems[fi];
          f.pregnant=true;f.pregnancyDays=0;f.lastMate=m.id;
          m.state='walk';m.nextState='love';m.target={x:clamp((m.x+f.x)/2-38,80,2680),y:clamp((m.y+f.y)/2,245,505)};m.animT=0;
          f.state='walk';f.nextState='love';f.target={x:clamp((m.x+f.x)/2+38,80,2680),y:clamp((m.y+f.y)/2,245,505)};f.animT=0;
          toast('💘 '+m.name+' 和 '+f.name+' 相爱了！'+f.name+' 怀孕（63 游戏天）');
          log(m.name+'×'+f.name+' 繁殖成功，怀孕 63 天');
          break outer;
        }
      }
    }
    save();
  }
  function currentTitleName(){
    for(var i=0;i<CFG.titles.length;i++)if(CFG.titles[i].id===S.titles.current)return CFG.titles[i].name;
    return '';
  }
  function inbred(a,b){
    var set={};
    set[a.id]=1;for(var i=0;i<a.parents.length;i++)set[a.parents[i]]=1;
    var union=a.parents.slice();
    var ka=(a.lineage||[]);
    for(var j=0;j<ka.length;j++){set[ka[j]]=1;}
    if(set[b.id])return true;
    for(var k=0;k<b.parents.length;k++)if(set[b.parents[k]])return true;
    var kb=(b.lineage||[]);
    for(var k2=0;k2<kb.length;k2++)if(set[kb[k2]])return true;
    return false;
  }

  /* ================= 状态机 ================= */
  function toIdle(c){c.state='idle';c.animT=0;c.idleT=rnd(2,5)*actIntervalMult();c.usingToy=null;c.lovePartner=null;c.eatApplied=false;c.playMate='';}
  function goTo(c,x,y,next,dir){
    c.target={x:clamp(x,40,2700),y:clamp(y,235,508)};
    c.state='walk';c.nextState=next;c.animT=0;c.arriveDir=dir||null;
  }
  function motherOf(c){
    if(!c.parents.length)return null;
    var m=catById(c.parents[0]);if(!m)m=catById(c.parents[1]);
    return m;
  }
  function usableToys(){
    return CFG.toys.filter(function(t){return S.facilities.toys[t.id]&&S.facilities.toys[t.id].dur>0&&t.id!=='bed'&&t.id!=='tree';});
  }

  function decide(c){
    var st=stageOf(c.ageDays);
    if(c.sick){c.state='sick';c.animT=0;return;}
    if(c.dying){c.state='sick';c.animT=0;return;}
    if(st==='kitten'){
      var mom=motherOf(c);
      if(mom&&mom.lactationDays>0&&c.hunger<75&&Math.random()<0.7){
        goTo(c,mom.x+rnd(-24,24),mom.y-6,'nurse');c.nurseMom=mom.id;return;
      }
      if(Math.random()<(0.35+0.35*nightFactor())){toSleep(c);return;}
      goTo(c,rnd(120,2600),rnd(250,500),'idle');return;
    }
    if(c.hunger<60&&dispenserFood()>0){c.eatApplied=false;goTo(c,BOWL.x-42+rnd(-4,4),504,'eat',1);return;}
    if(c.hunger<42&&dispenserFood()<=0&&Math.random()<0.7){goTo(c,102,504,'beg',1);return;}
    if(c.water<55&&!waterDirty()&&Math.random()<0.5){goTo(c,WBOWL.x-42,504,'drink',1);return;}
    if(c.clean<CFG.bath.dirtyAuto&&Math.random()<0.35){
      var dc=dirtiestBathCandidate();
      if(dc&&dc.id===c.id){
        goTo(c,BATH.x-34,BATH.y+20,'bathe',1);
        bubble(c,'脏死了，去洗澡');
        toast('🛁 '+c.name+' 太脏了，自己跑去找澡盆');
        return;
      }
    }
    if(Math.random()<0.06&&!litterFull()&&S.facilities.litter.clean>=25){goTo(c,LITTER.x+rnd(-10,10),486,'toilet',1);return;}
    if(S.grass&&S.grass.stage===2&&S.grass.bites>0&&Math.random()<0.12){goTo(c,1970,326,'eatgrass',1);return;}
    var owned=usableToys();
    var r=Math.random()*100;
    if(r<12&&owned.length&&c.mood<92){
      var toy=pick(owned);c.usingToy=toy.id;
      goTo(c,toy.x-32,toy.y+6,'play',1);return;
    }
    if(r<24){c.state=pick(['lick','lickpaw','lickbelly']);c.animT=0;return;}
    if(r<32+22*nightFactor()){toSleep(c);return;}
    goTo(c,rnd(80,2680),rnd(245,505),'idle');
  }
  function toSleep(c){
    var toys=S.facilities.toys;
    var bedFree=toys.bed&&toys.bed.dur>0&&!S.cats.some(function(o){return o!==c&&o.state==='sleep'&&o.sleepInBed;});
    c.sleepHeal=0;
    c.sleepInBed=!!bedFree;c.sleepDir=Math.random()<0.5?1:-1;
    if(bedFree)goTo(c,645+rnd(-6,6),318,'sleep');
    else goTo(c,rnd(140,2600),rnd(265,500),'sleep');
  }
  function dispenserFood(){var f=S.facilities.food;return f.brandUnits+f.cheapUnits;}

  function updateCats(dt){
    for(var i=0;i<S.cats.length;i++){
      var c=S.cats[i];
      // 状态里混进非数值就立刻修好（比每帧全量清洗便宜，只在异常时触发）
      if(!isFinite(c.health+c.hunger+c.water+c.mood+c.clean))repairCats();
      if(c.held){
        c.animT+=dt;
        c.heldBob=Math.sin(T*7+c.id)*2.2;
        c.blinkT-=dt;
        if(c.blinkT<=0){c.blink=0.15;c.blinkT=rnd(2.2,6);}
        if(c.blink>0)c.blink-=dt;
        continue;
      }
      c.animT+=dt;
      if(c.socialT>0)c.socialT-=dt;
      if(c.petT>0)c.petT-=dt;
      if(c.bubbleLife>0)c.bubbleLife-=dt;
      if(c.blinkT>0){c.blinkT-=dt;if(c.blinkT<=0){c.blink=0.15;c.blinkT=rnd(2.2,6);}}
      if(c.blink>0)c.blink-=dt;
      if(c.twitchT>0)c.twitchT-=dt;else if(Math.random()<dt*0.12)c.twitchT=0.35;
      c.bubbleT-=dt;
      if(c.bubbleT<=0){c.bubbleT=rnd(10,26);if(c.state!=='sleep'&&c.state!=='sick'&&Math.random()<0.4)bubble(c,pick(['喵~','喵呜?','咕~']));}

      // 活泼：5 分钟未互动 -10 心情
      if(c.personality==='lively'&&c.lastInteractReal>0){
        var el=T-c.lastInteractReal;
        var win=Math.floor(el/CFG.stats.livelyWindowSec);
        if(win>c.livelyWindows){c.livelyWindows=win;c.mood=clamp(c.mood-CFG.stats.livelyMoodLoss,0,100);bubble(c,'好无聊…');}
      }
      if(c.personality==='lively'&&c.lastInteractReal===0&&c.interacted){c.lastInteractReal=T;c.livelyWindows=0;}

      // 濒死红光
      if(c.dying&&Math.random()<dt*2)spawn('heart',c.x+rnd(-10,10),c.y-70,{life:0.7,vy:-18,size:3});

      switch(c.state){
        case 'idle':
          c.idleT-=dt;
          if(c.idleT<=0)decide(c);
          break;
        case 'walk':{
          var sp=speedOf(c);
          var dx=c.target.x-c.x, dy=c.target.y-c.y, d=Math.hypot(dx,dy);
          if(d<4){
            c.x=c.target.x;c.y=c.target.y;
            if(c.arriveDir)c.dir=c.arriveDir;
            c.state=c.nextState||'idle';c.nextState=null;c.arriveDir=null;c.animT=0;
            if(c.state==='idle')c.idleT=rnd(1.5,4)*actIntervalMult();
          }else{
            c.x+=dx/d*sp*dt;c.y+=dy/d*sp*dt;c.dir=dx>=0?1:-1;c.walkPhase+=dt*sp*0.16;
          }
          break;}
        case 'eat':{
          if(!c.eatApplied){
            c.eatApplied=true;
            var f2=S.facilities.food;
            var avail=f2.brandUnits+f2.cheapUnits;
            var take=Math.min(10,avail);
            var usedBrand=false;
            if(f2.brandUnits>=take){f2.brandUnits-=take;usedBrand=take>0;}
            else{var rem=take-f2.brandUnits;usedBrand=f2.brandUnits>0;f2.cheapUnits=Math.max(0,f2.cheapUnits-rem);f2.brandUnits=0;}
            c.eatBrand=usedBrand;
            if(!usedBrand&&take>0&&Math.random()<0.05){
              c.diarrheaDays=1;c.health=clamp(c.health-5,0,100);c.mood=clamp(c.mood-5,0,100);
              bubble(c,'拉肚子…');log(c.name+' 吃杂牌粮拉肚子了');
            }
          }
          c.hunger=clamp(c.hunger+34*dt,0,100);
          if(Math.random()<dt*3)spawn('crumb',c.x+30,c.y-26,{life:0.7,vy:24});
          if(c.animT>3.2||dispenserFood()<=0.5&&c.animT>1){
            c.hunger=100;
            if(c.eatBrand&&!c.brandToday){c.brandToday=true;c.mood=clamp(c.mood+5,0,100);}
            toIdle(c);
          }
          break;}
        case 'drink':
          if(c.animT>2){c.water=100;toIdle(c);}
          break;
        case 'begbath':
          if(c.animT<0.1)bubble(c,'想洗澡…');
          if(Math.random()<dt*0.5)bubble(c,'好脏呀');
          if(c.animT>5)toIdle(c);
          break;
        case 'beg':
          if(Math.random()<dt*0.4)bubble(c,pick(['喵呜~','好饿…']));
          if(c.animT>6)toIdle(c);
          break;
        case 'nurse':{
          var mom=catById(c.nurseMom);
          if(!mom||mom.lactationDays<=0){toIdle(c);break;}
          if(c.animT<0.1)bubble(c,'喝奶~');
          if(c.animT>4){c.hunger=clamp(c.hunger+30,0,100);c.mood=clamp(c.mood+5,0,100);toIdle(c);}
          break;}
        case 'toilet':
          if(c.animT<0.1)bubble(c,'上厕所');
          if(c.animT>3){S.facilities.litter.clean=clamp(S.facilities.litter.clean-CFG.stats.litter.useCleanCost,0,100);toIdle(c);}
          break;
        case 'sleep':{
          if(Math.random()<dt*1.1)spawn('zzz',c.x+c.sleepDir*14,c.y-46*scaleOf(c),{life:1.8,vy:-14});
          // 睡觉恢复健康：在床上睡回得更快
          if(c.health<100){
            var healRate=CFG.stats.sleepHealthPerSec*(c.sleepInBed?CFG.stats.bedSleepHealthMult:1);
            var hpBefore=c.health;
            c.health=clamp(c.health+healRate*dt,0,100);
            c.sleepHeal=(c.sleepHeal||0)+(c.health-hpBefore);
            if(Math.random()<dt*0.8)spawn('sparkle',c.x+rnd(-12,12),c.y-40*scaleOf(c),{life:0.9,size:2.6});
          }
          if(c.animT>rnd(15,30)||c.animT>32){
            var healed=c.sleepHeal||0;
            c.sleepHeal=0;
            toIdle(c);
            if(healed>=CFG.stats.sleepHealBubbleMin)bubble(c,'睡饱了 健康+'+Math.round(healed));
          }
          break;}
        case 'lick':case 'lickpaw':case 'lickbelly':{
          if(Math.random()<dt*0.06&&c.furToday<CFG.felt.furDailyMax){
            c.furToday++;S.inventory.catFur++;
            spawn('sparkle',c.x+rnd(-14,14),c.y-30,{life:0.8,size:3});
            if(Math.random()<0.3)bubble(c,'掉毛毛');
          }
          var dur=c.state==='lick'?rnd(6,12):(c.state==='lickpaw'?rnd(4,8):rnd(4,8));
          if(c.animT>4.5){c.clean=clamp(c.clean+CFG.stats.groomCleanGain,0,100);toIdle(c);}
          break;}
        case 'play':{
          if(c.animT<0.12&&c.playMate)bubble(c,'和'+c.playMate+'打闹');
          if(c.animT>5){
            var tt=S.facilities.toys[c.usingToy];
            if(tt)tt.dur=Math.max(0,tt.dur-1);
            if(tt&&tt.dur<=0){log(c.usingToy+' 玩具损坏了');delete S.facilities.toys[c.usingToy];}
            var moodGain=c.personality==='lively'?CFG.toyMood.lively:(c.personality==='introvert'?CFG.toyMood.introvert:CFG.toyMood.base);
            if(c.personality==='grumpy'){
              if(c.hostility>0&&Math.random()<CFG.toyMood.grumpyHissChance){c.state='hiss';c.animT=0;bubble(c,'呲——');c.hostility=clamp(c.hostility+CFG.personality.hissHostilityGain,0,100);break;}
              moodGain=CFG.toyMood.grumpy;
            }
            c.mood=clamp(c.mood+moodGain,0,100);c.interacted=true;c.lastInteractReal=T;c.livelyWindows=0;
            bumpQuest('play');
            if(c.playMate){c.mood=clamp(c.mood+CFG.social.mood,0,100);bubble(c,'玩得开心~');}
            heartBurst(c.x+26,c.y-40,2);
            toIdle(c);
          }
          break;}
        case 'bathe':{
          if(c.animT<0.15){bubble(c,'洗澡澡…');}
          if(Math.random()<dt*6)spawn('sparkle',c.x+rnd(-16,16),c.y-rnd(20,52),{life:0.9,size:rnd(2,3.5)});
          if(Math.random()<dt*3)spawn('heart',c.x+rnd(-14,14),c.y-rnd(46,64),{life:0.8,vy:-16,size:3});
          if(c.animT>CFG.bath.duration){
            c.clean=CFG.bath.cleanTo;
            c.health=clamp(c.health+CFG.bath.healthGain,0,100);
            var mm=CFG.bath.moodBase;
            if(c.personality==='grumpy')mm=CFG.bath.moodGrumpy;
            else if(c.personality==='introvert')mm=CFG.bath.moodIntrovert;
            c.mood=clamp(c.mood+mm,0,100);
            bubble(c,'香喷喷~');
            toIdle(c);
          }
          break;}
        case 'eatgrass':{
          if(c.animT<0.1)bubble(c,'嚼猫草~');
          if(Math.random()<dt*2)spawn('sparkle',c.x+rnd(10,30),c.y-rnd(20,36),{life:0.7,size:2.5});
          if(c.animT>3){
            var g0=S.grass;
            if(g0&&g0.stage===2&&g0.bites>0){
              g0.bites--;
              c.mood=clamp(c.mood+CFG.catgrass.mood,0,100);
              c.health=clamp(c.health+CFG.catgrass.health,0,100);
              if(g0.bites<=0){g0.stage=0;toast('🌿 猫草被吃光了，可以再种');log('猫草被吃光');}
            }
            toIdle(c);
          }
          break;}
        case 'sick':
          if(c.vomitToday&&!c.shownVomit&&Math.random()<dt*0.2){
            c.shownVomit=true;bubble(c,'呕吐…');spawn('crumb',c.x+c.dir*20,c.y-16,{life:1,vy:10});
          }
          if(!c.sick&&!c.dying)toIdle(c);
          break;
        case 'hiss':
          if(c.animT>3)toIdle(c);
          break;
        case 'love':{
          if(Math.random()<dt*4)spawn('heart',c.x+c.dir*30,c.y-58,{life:1.2,vy:-24,size:4.5});
          if(c.animT>2.4)toIdle(c);
          break;}
      }
    }
  }

  /* ================= 互动 ================= */
  function markInteract(c){c.interacted=true;c.lastInteractReal=T;c.livelyWindows=0;}
  function petCat(c){
    if(T-c.lastPet<2.5){bubble(c,'…');return;}
    c.lastPet=T;
    if(c.personality==='lively'){
      c.mood=clamp(c.mood+CFG.personality.pet.lively,0,100);
      sfx('meow');
      c.petT=2;heartBurst(c.x,c.y-60*scaleOf(c),3);bubble(c,'咕噜咕噜');
    }else if(c.personality==='introvert'){
      c.mood=clamp(c.mood+CFG.personality.pet.introvert,0,100);
      bubble(c,'呜…别摸');spawn('text',c.x,c.y-92,{text:'心情-5',life:1.2,vy:-24});
    }else{
      var r=Math.random();
      if(r<CFG.personality.pet.grumpyScratchChance){
        c.hostility=clamp(c.hostility+CFG.personality.scratchHostilityGain,0,100);
        if(!S.humanScratch){S.humanScratch={deadlineDay:S.day+CFG.stats.nearDeathDays};}
        toast('🩹 你被 '+c.name+' 挠伤了！'+CFG.stats.nearDeathDays+' 天内去打人疫苗（200 猫币）');
        log('被 '+c.name+' 挠伤，需人疫苗');
        c.state='hiss';c.animT=0;bubble(c,'挠你！');
      }else if(r<CFG.personality.pet.grumpyScratchChance+CFG.personality.pet.grumpyHissChance){
        c.mood=clamp(c.mood-2,0,100);
        c.hostility=clamp(c.hostility+CFG.personality.hissHostilityGain,0,100);
        c.state='hiss';c.animT=0;bubble(c,'呲——');sfx('hiss');
      }else{
        c.mood=clamp(c.mood+CFG.personality.pet.grumpy,0,100);
        c.petT=2;heartBurst(c.x,c.y-60*scaleOf(c),2);bubble(c,'勉强让你摸');
      }
    }
    bumpQuest('pet');
    markInteract(c);
    if(c.state==='sleep'&&c.animT>4){toIdle(c);bubble(c,'喵?');}
  }
  function feedTreat(c,kind){
    bumpQuest('treat');
    var inv={normal:'treatNormal',good:'treatGood',vip:'treatVip'}[kind];
    var def=CFG.shop.treats[kind];
    if(S.inventory[inv]<=0){toast('库存没有'+def.name+'，去商城买');return;}
    if(c.treatsToday>=CFG.stats.treatDailyCap){toast(c.name+' 今天的猫条吃够了（上限5）');return;}
    S.inventory[inv]--;
    c.treatsToday++;
    c.favor=clamp(c.favor+def.favor,0,100);
    c.mood=clamp(c.mood+def.mood,0,100);
    c.hunger=clamp(c.hunger+8,0,100);
    c.petT=2.5;
    sfx('pop');
    if(c.personality==='grumpy')c.hostility=clamp(c.hostility-CFG.personality.treatHostilityDown,0,100);
    heartBurst(c.x,c.y-60*scaleOf(c),5);
    bubble(c,'好吃~');
    markInteract(c);
    save();
  }
  // 找"最想洗"的猫：排除生病 / 濒死 / 正在洗
  function isDewormOverdue(c){
    return c.wormSeason!==gameSeasonIdx(S.day);
  }

  function dirtiestBathCandidate(){
    var best=null;
    for(var i=0;i<S.cats.length;i++){
      var c=S.cats[i];
      if(c.sick||c.dying||c.state==='bathe')continue;
      if(!best||c.clean<best.clean)best=c;
    }
    return best;
  }
  function bathCat(c,instant){
    if(!c)return;
    if(c.state==='bathe'){toast(c.name+' 正在洗呢');return;}
    if(c.sick||c.dying){toast(c.name+' 身体不舒服，先去医院吧');return;}
    if(instant===false){
      // 猫自己脏得受不了 → 小跑过去
      goTo(c,BATH.x-34,BATH.y+20,'bathe',1);
      bubble(c,'去洗澡~');
      toast('🛁 '+c.name+' 脏得受不了，自己去洗澡（免费）');
    }else{
      // 玩家安排 → 立刻到澡盆开始洗，避免长距离步行让人以为没反应
      c.held=false;
      c.x=clamp(BATH.x-30,60,860);
      c.y=clamp(BATH.y+18,240,510);
      c.state='bathe';
      c.animT=0;
      c.target=null;
      c.nextState=null;
      bubble(c,'洗澡澡~');
      toast('🛁 '+c.name+' 开始洗澡（免费）');
    }
    bumpQuest('bath');
    sfx('click');
    save();
  }

  function playToy(c,toyId){
    var toy=S.facilities.toys[toyId];
    if(!toy||toy.dur<=0){toast('没有这个玩具或已损坏');return;}
    var tdef=null;
    for(var i=0;i<CFG.toys.length;i++)if(CFG.toys[i].id===toyId)tdef=CFG.toys[i];
    c.usingToy=toyId;
    goTo(c,tdef.x-32,tdef.y+6,'play',1);
  }

  /* ================= 设施操作 ================= */
  function refillFood(kind,force){
    var invKey=kind==='brand'?'brandFoodBag':'cheapFoodBag';
    var f=S.facilities.food;
    if(S.inventory[invKey]<=0){toast('库存没有'+(kind==='brand'?'品牌':'杂牌')+'猫粮，去商城买');return;}
    if(f.brandUnits+f.cheapUnits>=CFG.dispenserCap){toast('猫粮器已满（'+CFG.dispenserCap+'）');return;}
    var space=CFG.dispenserCap-(f.brandUnits+f.cheapUnits);
    var units=kind==='brand'?CFG.shop.brandFood.units:CFG.shop.cheapFood.units;
    if(units>space&&!force){
      if(confirm('猫粮器剩余空间 '+Math.floor(space)+' 单位，一袋有 '+units+' 单位，会溢出 '+(units-Math.floor(space))+' 单位。确定要全部倒入吗？（溢出部分浪费）')){
        refillFood(kind,true);
      }
      return;
    }
    S.inventory[invKey]--;
    var units=kind==='brand'?CFG.shop.brandFood.units:CFG.shop.cheapFood.units;
    if(kind==='brand')f.brandUnits=Math.min(CFG.dispenserCap-f.cheapUnits,f.brandUnits+units);
    else f.cheapUnits=Math.min(CFG.dispenserCap-f.brandUnits,f.cheapUnits+units);
    for(var i=0;i<4;i++)spawn('sparkle',BOWL.x+rnd(-20,20),BOWL.y-rnd(4,20),{life:0.8,size:rnd(2,3.5)});
    toast('🍚 补粮 +'+units+' 单位');
    sfx('click');
    save();
  }
  function scoopLitter(){
    var L=S.facilities.litter;
    var before=L.clean;
    var needChange=L.daysSinceChange>=CFG.stats.litter.changeBagEveryDays;
    var changed=false;
    if(needChange){
      var need=clamp(Math.ceil(L.daysSinceChange),1,CFG.litterUnits.maxPerChange);
      var have=S.inventory.litterUnits||0;
      var use=Math.min(need,have);
      if(use>0){
        S.inventory.litterUnits-=use;
        S.coins=Math.max(0,S.coins-use*CFG.litterUnits.pricePerUnit);
        L.daysSinceChange=0;
        L.clean=100;
        changed=true;
        if(use<need)toast('🧹 猫砂不够，只加了 '+use+' 份（-¥'+(use*CFG.litterUnits.pricePerUnit)+'），没铺满但能用了');

  var socialTimer=3;
  function updateWorld(dt){
    socialTimer-=dt;
    if(socialTimer<=0){
      socialTimer=CFG.social.interval;
      if(S.cats.length>=2&&Math.random()<CFG.social.chance){
        var free=S.cats.filter(function(c){return c.state==='idle'&&c.socialT<=0&&!c.sick&&!c.dying;});
        if(free.length>=2){
          var best=null;
          for(var fi=0;fi<free.length;fi++)for(var fj=fi+1;fj<free.length;fj++){
            var d2=Math.hypot(free[fi].x-free[fj].x,free[fi].y-free[fj].y);
            if(!best||d2<best.d)best={a:free[fi],b:free[fj],d:d2};
          }
          var mx=clamp((best.a.x+best.b.x)/2,120,2640),my=clamp((best.a.y+best.b.y)/2,250,500);
          best.a.playMate=best.b.name;best.b.playMate=best.a.name;
          goTo(best.a,mx-26,my,'play',1);
          goTo(best.b,mx+26,my,'play',-1);
          best.a.socialT=rnd(CFG.social.cooldown[0],CFG.social.cooldown[1]);
          best.b.socialT=best.a.socialT;
        }
      }
    }
    if(S.grass&&S.grass.stage===1&&T-S.grass.plantedAt>=CFG.catgrass.growSec){
      S.grass.stage=2;S.grass.bites=CFG.catgrass.bites;
      toast('🌿 猫草长好了！小猫们会自己去啃');
      sfx('success');

  }

  var m3={on:false,score:0,moves:0,grid:[]};
  var m3Box=document.getElementById('md-m3');
  var m3Grid=document.getElementById('md-m3-grid');
  var M3_ICONS=['🐟','🍖','🧶','🎾','⭐'];
  function m3Start(){
    if(m3.on)return;
    m3.on=true;m3.score=0;m3.moves=CFG.match3.moves;m3.grid=[];
    var n=CFG.match3.size;
    for(var r=0;r<n;r++){var row=[];for(var c=0;c<n;c++)row.push(Math.floor(Math.random()*CFG.match3.kinds));m3.grid.push(row);}
    m3Box.hidden=false;
    m3Render();
    scrollGameIntoView();
  }
  function m3Render(){
    document.getElementById('md-m3-score').textContent=m3.score;
    document.getElementById('md-m3-moves').textContent=m3.moves;
    m3Grid.innerHTML='';
    var n=CFG.match3.size;
    for(var r=0;r<n;r++)for(var c=0;c<n;c++){
      (function(r,c){
        var b=document.createElement('button');
        b.type='button';
        b.textContent=M3_ICONS[m3.grid[r][c]];
        b.setAttribute('aria-label','第'+(r+1)+'行第'+(c+1)+'列 '+M3_ICONS[m3.grid[r][c]]);
        b.addEventListener('click',function(){m3Click(r,c);});
        m3Grid.appendChild(b);
      })(r,c);
    }
  }
  function m3Click(r,c){
    if(!m3.on||m3.lock)return;
    var n=CFG.match3.size,kind=m3.grid[r][c];
    var seen={},grp=[],stack=[[r,c]];
    while(stack.length){
      var p=stack.pop(),rr=p[0],cc=p[1];
      if(rr<0||cc<0||rr>=n||cc>=n)continue;
      var k=rr+'_'+cc;
      if(seen[k]||m3.grid[rr][cc]!==kind)continue;
      seen[k]=1;grp.push([rr,cc]);
      stack.push([rr+1,cc],[rr-1,cc],[rr,cc+1],[rr,cc-1]);
    }
    if(grp.length<2){beep(220,0.05,'square',0.03);return;}
    m3.lock=true;
    for(var i=0;i<grp.length;i++)m3.grid[grp[i][0]][grp[i][1]]=-1;
    m3.moves--;
    m3.score+=grp.length*grp.length*10;
    for(var cc2=0;cc2<n;cc2++){
      var col=[];
      for(var rr2=n-1;rr2>=0;rr2--)if(m3.grid[rr2][cc2]>=0)col.push(m3.grid[rr2][cc2]);
      for(var rr3=n-1;rr3>=0;rr3--){
        m3.grid[rr3][cc2]=col.length>0?col.shift():Math.floor(Math.random()*CFG.match3.kinds);
      }
    }
    sfx('pop');
    m3Render();
    setTimeout(function(){
      m3.lock=false;
      if(m3.on&&m3.moves<=0)m3End();
    },180);
  }
  function m3End(){
    if(!m3.on)return;
    m3.on=false;
    m3Box.hidden=true;
    var seeds=m3.score>=CFG.match3.seedScore2?2:(m3.score>=CFG.match3.seedScore?1:0);

  }

  function startCookbar(a,b){
    if(cookbar.on)return;
    a=a||cookbar.a;b=b||cookbar.b;
    if(S.inventory[a]<=0||S.inventory[b]<=0){toast('食材不够，先购买');return;}
    if(a===b){toast('要选两种不同食材');return;}
    cookbar.a=a;cookbar.b=b;
    cookbar.on=true;cookbar.pos=0;cookbar.dir=1;cookbar.last=0;
    cookbarBox.hidden=false;
    scrollGameIntoView();
    // 用 setInterval 驱动（rAF 在后台页会被挂起），16ms 步进
    cookbar.last=performance.now();
    var lastTick=performance.now();
    clearInterval(cookbar.raf);
    cookbar.raf=setInterval(function(){
      if(!cookbar.on){clearInterval(cookbar.raf);return;}
      var now=performance.now();
      var dt=Math.min(0.05,(now-lastTick)/1000);
      lastTick=now;
      cookbar.pos+=cookbar.dir*dt*(1000/CFG.cooking.barMs);
      if(cookbar.pos>=1){cookbar.pos=1;cookbar.dir=-1;}
      if(cookbar.pos<=0){cookbar.pos=0;cookbar.dir=1;}
      if(cookbarCursor)cookbarCursor.style.left=(cookbar.pos*100)+'%';
    },16);
  }
  function judgeCookbar(){
    if(!cookbar.on)return;
    var p=cookbar.pos,off=Math.abs(p-0.5);
    var q='miss';
    if(off<=CFG.cooking.perfectHalf)q='perfect';
    else if(off<=CFG.cooking.goodHalf)q='good';
    cookbar.on=false;
    clearInterval(cookbar.raf);
    cookbarBox.hidden=true;
    cookMeal(cookbar.a,cookbar.b,q);
    if(panelPlayEl)panelPlayEl.dataset.sig='';

  function updateWool(dt){
    if(!wool.on)return;
    // 篮子平滑跟随
    wool.bx+=(wool.px-wool.bx)*Math.min(1,dt*22);
    // 生成
    wool.spawnT-=dt;
    if(wool.spawnT<=0&&wool.items.length<14){
      var diff=1+(CFG.wool.durationSec-wool.t)/CFG.wool.durationSec*0.8;
      wool.spawnT=rnd(0.30,0.55)/diff;
      var r=Math.random(),w=CFG.wool.weights,type='fur';
      if(r<w.junk)type='junk';
      else if(r<w.junk+w.gold)type='gold';
      wool.items.push({
        x:rnd(36,604),y:-20-vmRnd(0,40),type:type,
        vy:rnd(92,148)*diff, ph:rnd(0,6), sway:rnd(14,34),
        col:type==='fur'?pick(WOOL_COLORS):(type==='gold'?'#F2C14E':'#B08A63'),
        rot:rnd(-0.4,0.4),spin:rnd(-1.6,1.6)
      });
    }
    // 掉落与接取
    for(var i=wool.items.length-1;i>=0;i--){
      var it=wool.items[i];
      it.y+=it.vy*dt;
      it.ph+=dt*2.2;
      it.rot+=it.spin*dt;
      var drawX=it.x+Math.sin(it.ph)*it.sway*0.35;
      // 篮子判定：底部区域
      if(it.y>258&&it.y<330){
        if(Math.abs(drawX-wool.bx)<CFG.wool.basketW/2+14){
          if(it.type==='junk'){
            wool.score=Math.max(0,wool.score-CFG.wool.junkPenalty);
            wool.combo=0;
            sfx('hiss');
            spawn('text',it.x,300,{text:'-'+CFG.wool.junkPenalty,life:0.9,vy:-22});
          }else{
            var val=it.type==='gold'?CFG.wool.goldValue:1;
            wool.score+=val;
            wool.combo++;
            if(wool.combo>0&&wool.combo%5===0)spawn('text',it.x,286,{text:'连击×'+wool.combo,life:0.9,vy:-24});
            spawn('sparkle',it.x,it.y,{life:0.5,size:2.5});
            sfx('pop');
          }
          wool.items.splice(i,1);
          updWoolHud();
          continue;
        }
      }
      if(it.y>340)wool.items.splice(i,1);
    }
  }
  function vmRnd(a,b){return a+Math.random()*(b-a);}

    }
    // 篮口
    wctx.fillStyle='#C1834A';
    wctx.beginPath();wctx.ellipse(bx,by-16,bw/2,8,0,0,Math.PI*2);wctx.fill();

  var fish={on:false,t:0,score:0,fishes:[],spawnT:0,timerId:0};

  function updFishHud(){
    document.getElementById('md-fish-time').textContent=Math.max(0,Math.ceil(fish.t));
    document.getElementById('md-fish-score').textContent=fish.score;
  }
  function startFish(){
    if(fish.on)return;
    if(S.daily.fishRounds<=0){toast('本季度抓鱼次数用完了（每季度 '+CFG.fishing.roundsPerSeason+' 次）');return;}
    fish.on=true;fish.t=CFG.fishing.durationSec;fish.score=0;fish.fishes=[];fish.spawnT=0;
    fishBox.hidden=false;
    scrollGameIntoView();
    updFishHud();
    clearInterval(fish.timerId);
    // 计时用 interval 驱动：页面切后台导致动画帧暂停时，回合仍会正常结束并自动收起浮层
    fish.timerId=setInterval(function(){
      if(document.visibilityState!=='visible')return;
      fish.t-=1;
      updFishHud();
      if(fish.t<=0)endFish();
    },1000);
  }
  function endFish(){
    if(!fish.on)return;
    bumpQuest('fish');
    if(fish.score>0)bumpQuest('fishpt',fish.score);
    S.daily.fishTotal=(S.daily.fishTotal||0)+1;
    S.daily.fishPts=(S.daily.fishPts||0)+fish.score;
    fish.on=false;
    clearInterval(fish.timerId);
    fishBox.hidden=true;
    S.daily.fishRounds--;
    S.coins+=fish.score;
    if(fish.score>0){toast('🎣 抓鱼结束！得分 '+fish.score+'，+'+fish.score+' 猫币');log('抓鱼 +'+fish.score+' 猫币');}
    else toast('🎣 一条都没抓到…');

  }
  function updateFish(dt){

    }

  function drawFish(){
    fctx.clearRect(0,0,640,300);

  function rr(x,y,w,h,r){
    ctx.beginPath();
    if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return;}
    ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function E(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}}
  function heartPath(r){
    ctx.beginPath();
    ctx.arc(-r*0.35,-r*0.2,r*0.45,0,Math.PI*2);
    ctx.arc(r*0.35,-r*0.2,r*0.45,0,Math.PI*2);
    ctx.moveTo(-r*0.78,-r*0.02);ctx.lineTo(r*0.78,-r*0.02);ctx.lineTo(0,r*0.85);ctx.closePath();
  }

  function nightFactor(){
    var f=(S.timeSec%CFG.secPerDay)/CFG.secPerDay;
    if(f<0.66)return 0;
    if(f<0.80)return (f-0.66)/0.14;
    if(f<0.94)return 1;
    return Math.max(0,1-(f-0.94)/0.06);
  }

      ctx.fillStyle=dv>0.3?'#7FBF5A':'#E9A13B';
      rr(t.x-16,t.y+6,32*dv,4,2);ctx.fill();
    }
  }

  /* ================= 绘制：猫 ================= */
  var tid0=0;
  function drawTail(mode,coat,swaySpd){
    ctx.strokeStyle=coat.base;ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();
    if(mode==='sleep'){ctx.moveTo(-26,-8);ctx.quadraticCurveTo(-16,-1,8,-5);}
    else if(mode==='up-stiff'){ctx.moveTo(-24,-21);ctx.quadraticCurveTo(-33,-30,-32,-52);}
    else if(mode==='curl'){ctx.moveTo(-20,-16);ctx.quadraticCurveTo(-2,-2,12,-4);}
    else{
      var sw=Math.sin(T*(swaySpd||1.8)+tid0)*3;
      ctx.moveTo(-24,-21);ctx.quadraticCurveTo(-34,-28,-38+sw,-46+sw*0.6);
    }
    ctx.stroke();
    if(coat.type==='tabby'){
      var ex2=mode==='sleep'?8:(mode==='up-stiff'?-32:(mode==='curl'?12:-38+Math.sin(T*(swaySpd||1.8)+tid0)*3));
      var ey2=mode==='sleep'?-5:(mode==='up-stiff'?-52:(mode==='curl'?-4:-46+Math.sin(T*(swaySpd||1.8)+tid0)*1.8));
      ctx.fillStyle=coat.dark;ctx.beginPath();ctx.arc(ex2,ey2,4.6,0,Math.PI*2);ctx.fill();
    }
  }
  function drawEarAt(ex,ey,rot,twitch,coat,back){
    ctx.save();ctx.translate(ex,ey);
    ctx.rotate(rot+(twitch?Math.sin(T*42)*0.16:0)+(back?0.85:0));
    ctx.beginPath();ctx.moveTo(-7,4);ctx.quadraticCurveTo(-2,-6,0,-13);ctx.quadraticCurveTo(2,-6,7,4);ctx.closePath();
    ctx.fillStyle=coat.base;ctx.fill();
    ctx.beginPath();ctx.moveTo(-3.4,2.5);ctx.quadraticCurveTo(-1,-3,0,-7.5);ctx.quadraticCurveTo(1,-3,3.4,2.5);ctx.closePath();
    ctx.fillStyle='#F2B8C6';ctx.fill();
    ctx.restore();
  }
  function drawFaceAt(hx,hy,HR,eyes,eyeScale,mouthOpen,coat,c){
    var ex=HR*0.42,ey=hy-HR*0.06,er=HR*0.17*(eyeScale||1);
    var eff=eyes;if(eff==='open'&&c.blink>0)eff='closed';
    if(eff==='open'){
      ctx.fillStyle=coat.eye;
      ctx.beginPath();ctx.arc(hx-ex,ey,er,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(hx+ex,ey,er,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.beginPath();ctx.arc(hx-ex-er*0.3,ey-er*0.3,er*0.32,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(hx+ex-er*0.3,ey-er*0.3,er*0.32,0,Math.PI*2);ctx.fill();
    }else if(eff==='closed'){
      ctx.strokeStyle=coat.eye;ctx.lineWidth=2.2;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(hx-ex,ey+er*0.3,er,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
      ctx.beginPath();ctx.arc(hx+ex,ey+er*0.3,er,Math.PI*0.15,Math.PI*0.85);ctx.stroke();
    }else{
      ctx.strokeStyle=coat.eye;ctx.lineWidth=2.2;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(hx-ex,ey-er*0.2,er,Math.PI*1.12,Math.PI*1.88);ctx.stroke();
      ctx.beginPath();ctx.arc(hx+ex,ey-er*0.2,er,Math.PI*1.12,Math.PI*1.88);ctx.stroke();
    }
    ctx.fillStyle='#F27E9D';
    var nw=HR*0.12;
    ctx.beginPath();ctx.moveTo(hx-nw,hy+HR*0.18);ctx.lineTo(hx+nw,hy+HR*0.18);ctx.lineTo(hx,hy+HR*0.31);ctx.closePath();ctx.fill();
    if(mouthOpen){E(hx,hy+HR*0.44,HR*0.14,HR*0.16,'#F08A9B');}
    else{
      ctx.strokeStyle='#8A6A72';ctx.lineWidth=1.6;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(hx-HR*0.11,hy+HR*0.34,HR*0.12,Math.PI*0.05,Math.PI*0.95);ctx.stroke();
      ctx.beginPath();ctx.arc(hx+HR*0.11,hy+HR*0.34,HR*0.12,Math.PI*0.05,Math.PI*0.95);ctx.stroke();
    }
    ctx.strokeStyle='rgba(70,60,60,.35)';ctx.lineWidth=1;
    for(var side=-1;side<=1;side+=2)for(var wi=0;wi<3;wi++){
      var wy=hy+HR*0.14+wi*HR*0.1;
      ctx.beginPath();ctx.moveTo(hx+side*HR*0.5,wy);ctx.lineTo(hx+side*(HR*0.9),wy-HR*0.06+(wi-1)*HR*0.08);ctx.stroke();
    }
    ctx.fillStyle='rgba(255,140,155,'+(c.petT>0?0.5:0.22)+')';
    ctx.beginPath();ctx.arc(hx-HR*0.66,hy+HR*0.18,HR*0.13,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(hx+HR*0.66,hy+HR*0.18,HR*0.13,0,Math.PI*2);ctx.fill();
  }
  function drawCat(c){
    var s=scaleOf(c),kit=stageOf(c.ageDays)==='kitten';
    var coat=COATS[c.coat],st=c.state,ct=c.animT;
    if(S.selected===c.id){
      ctx.save();
      ctx.strokeStyle=c.dying?'rgba(222,106,106,.95)':'rgba(242,162,12,.95)';ctx.lineWidth=2.5;
      ctx.setLineDash([6,5]);ctx.lineDashOffset=-T*20;
      ctx.beginPath();ctx.ellipse(c.x,c.y+2,46*s,13*s,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    E(c.x,c.y+2,36*s,9*s,heldNow?'rgba(90,60,40,.05)':'rgba(90,60,40,.13)');
    ctx.save();
    ctx.translate(c.x,c.y);
    var flip=(st==='sleep'||st==='sick')?c.sleepDir:c.dir;
    if(st==='sick')flip=c.dir;
    ctx.scale(flip*s,s);
    tid0=c.id*1.7;

    var bob=0,breathe=Math.sin(T*2.3+c.id)*0.9;
    var heldNow=!!c.held;
    var headX=20,headY=-47,headR=21*(kit?1.14:1);
    var bodyX=-3,bodyY=-25,bodyRX=25,bodyRY=19;
    var legH=12,tailMode='up',eyes='open',eyeScale=kit?1.15:1,mouthOpen=false;
    var tongue=null,bodyRot=0,supportLeg=null,raisedPaw=null,hideLegs=false,begPose=false;
    var lifts=[0,0,0,0],earsBack=false;
    var vib=0;

    if(st==='walk'){
      bob=Math.abs(Math.sin(c.walkPhase*2))*3;
      for(var li=0;li<4;li++)lifts[li]=Math.max(0,Math.sin(c.walkPhase*2+(li%2)*Math.PI+(li<2?0:Math.PI*0.5)))*4.5;
    }
    else if(st==='eat'){headX=26;headY=-30+Math.sin(ct*9)*2.5;mouthOpen=Math.sin(ct*9)>0.3;eyes='closed';}
    else if(st==='drink'){headX=24;headY=-28+Math.sin(ct*10)*1.5;tongue={x:31,y:-20};}
    else if(st==='eatgrass'){headX=24;headY=-27+Math.sin(ct*8)*1.5;tongue={x:30,y:-18};eyes='closed';}
    else if(st==='nurse'){legH=8;bodyY=-20;headX=24;headY=-24+Math.sin(ct*6)*2;tongue={x:28,y:-16};eyes='closed';}
    else if(st==='beg'){begPose=true;hideLegs=true;bodyX=-6;bodyY=-32;bodyRX=20;bodyRY=24;headX=14;headY=-60;tailMode='curl';eyeScale=(kit?1.15:1)*1.18;}
    else if(st==='sleep'||st==='sick'){
      hideLegs=true;
      bodyX=0;bodyY=-13;bodyRX=29;bodyRY=14+Math.sin(T*(st==='sick'?3:1.4)+c.id)*1.2;
      headX=16;headY=-22;headR=19*(kit?1.12:1);
      tailMode='sleep';eyes='closed';
      if(st==='sick'){
        mouthOpen=Math.sin(T*2)>0.5;
        headY=-20+Math.sin(T*4)*1;
      }
    }
    else if(st==='lick'){headX=-11+Math.sin(ct*5)*1.5;headY=-42+Math.sin(ct*7)*2;tongue={x:3,y:-25};eyes='closed';bodyRot=Math.sin(ct*7)*0.03;}
    else if(st==='lickpaw'){
      hideLegs=true;bodyX=-6;bodyY=-29;bodyRX=20;bodyRY=21;
      headX=13;headY=-38+Math.sin(ct*7)*2;
      raisedPaw={x:18,y:-24,rot:0.9+Math.sin(ct*7)*0.15};
      tongue={x:27,y:-33};eyes='closed';supportLeg={x:6};
    }
    else if(st==='lickbelly'){legH=6;bodyY=-18;bodyRX=26;bodyRY=16;headX=24;headY=-26+Math.sin(ct*8)*2.5;tongue={x:19,y:-11};eyes='closed';}
    else if(st==='play'){raisedPaw={x:26,y:-22,rot:1.2+Math.sin(ct*8)*0.35};bob=Math.abs(Math.sin(ct*7))*1.5;if(Math.sin(ct*3)>0)eyes='happy';}
    else if(st==='toilet'){bodyY=-21;legH=9;tailMode='up-stiff';}
    else if(st==='hiss'){earsBack=true;bob=Math.sin(T*30)*1.2;eyes='happy';mouthOpen=true;headY=-45;vib=1;}
    else if(st==='love'){bob=Math.abs(Math.sin(ct*6))*4;eyes='happy';}
    if(heldNow){
      hideLegs=true;
      bodyY=-30;bodyRX=23;bodyRY=21;
      headX=16;headY=-52;headR=21*(kit?1.14:1);
      eyes='open';eyeScale*=1.2;
      bob=(c.heldBob||0);
      tailMode='curl';
      legH=5;
    }
    if(c.petT>0&&eyes==='open')eyes='happy';

    if(st==='sick'){
      ctx.save();
      ctx.fillStyle='rgba(140,190,120,.18)';
      E(0,-30,40,32,'rgba(140,190,120,.18)');
      ctx.restore();
    }
    if(c.dying){
      ctx.save();
      ctx.strokeStyle='rgba(222,106,106,'+(0.4+0.3*Math.sin(T*4))+')';
      ctx.lineWidth=3;
      ctx.beginPath();ctx.ellipse(0,-28,42,36,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }

    ctx.rotate(bodyRot);
    ctx.translate(0,-bob+vib*Math.sin(T*50)*0.8);
    drawTail(tailMode,coat,c.petT>0?6:1.8);
    if(!hideLegs){
      var xs=[-17,-9,9,17];
      for(var i2=0;i2<4;i2++){
        var lx2=xs[i2],L2=lifts[i2];
        ctx.fillStyle=coat.base;
        rr(lx2-4.5,-L2-legH,9,legH+L2+2,4.5);ctx.fill();
        if(i2<2){ctx.fillStyle='rgba(0,0,0,.06)';rr(lx2-4.5,-L2-legH,9,legH+L2+2,4.5);ctx.fill();}
      }
    }
    ctx.save();
    ctx.translate(bodyX,bodyY);
    E(0,0,bodyRX,bodyRY,coat.base);
    if(c.pregnant)E(-2,2,bodyRX*0.55,bodyRY*0.7,'rgba(255,255,255,.14)');
    if(coat.type==='tabby'){
      ctx.strokeStyle=coat.dark;ctx.lineWidth=4.5;ctx.lineCap='round';
      var strp=[-14,-4,6];
      for(var si=0;si<3;si++){
        ctx.beginPath();ctx.moveTo(strp[si]-4,-bodyRY+6);ctx.quadraticCurveTo(strp[si],-bodyRY-2,strp[si]+4,-bodyRY+6);ctx.stroke();
      }
    }else if(coat.type==='cow'){ctx.save();ctx.rotate(0.35);E(-6,-8,13,9,coat.dark);ctx.restore();}
    else if(coat.type==='calico'){ctx.save();ctx.rotate(-0.2);E(-11,-9,11,8,coat.accent);ctx.restore();ctx.save();ctx.rotate(0.3);E(7,-6,9,7,coat.dark);ctx.restore();}
    else if(coat.type==='bib'){E(17,7,8,10,coat.belly);}
    if(coat.type!=='bib'&&coat.type!=='white')E(8,bodyRY-6,12,6,coat.belly);
    if(c.pregnant){ctx.fillStyle='rgba(255,120,150,.75)';heartPath(4.5);ctx.fill();}
    ctx.restore();
    if(begPose){
      ctx.fillStyle=coat.base;
      rr(4,-26,8,28,4);ctx.fill();rr(13,-26,8,28,4);ctx.fill();
      ctx.strokeStyle='rgba(70,60,60,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(6,-2);ctx.lineTo(10,-2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(15,-2);ctx.lineTo(19,-2);ctx.stroke();
    }
    if(supportLeg){ctx.fillStyle=coat.base;rr(supportLeg.x-4,-14,8,16,4);ctx.fill();}
    if(raisedPaw){
      ctx.save();ctx.translate(raisedPaw.x,raisedPaw.y);ctx.rotate(raisedPaw.rot);
      ctx.fillStyle=coat.base;rr(-4,-19,8,21,4);ctx.fill();ctx.restore();
    }
    drawEarAt(headX-headR*0.6,headY-headR*0.72,-0.26,c.twitchT>0,coat,earsBack);
    drawEarAt(headX+headR*0.56,headY-headR*0.76,0.28,false,coat,earsBack);
    E(headX,headY,headR,headR,coat.base);
    if(coat.type==='tabby'){
      ctx.strokeStyle=coat.dark;ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(headX-4,headY-headR+5);ctx.lineTo(headX-2,headY-headR+11);ctx.stroke();
      ctx.beginPath();ctx.moveTo(headX+2,headY-headR+5);ctx.lineTo(headX+4,headY-headR+11);ctx.stroke();
    }else if(coat.type==='cow'){ctx.save();ctx.rotate(-0.3);E(headX+headR*0.45,headY-headR*0.5,10,9,coat.dark);ctx.restore();}
    else if(coat.type==='calico'){ctx.save();ctx.rotate(-0.15);E(headX-headR*0.35,headY-headR*0.55,11,8,coat.accent);ctx.restore();}
    drawFaceAt(headX,headY,headR,eyes,eyeScale,mouthOpen,coat,c);
    if(tongue&&Math.sin(ct*13)>-0.2){
      var tl=2.5+Math.sin(ct*13)*1.5;
      E(tongue.x,tongue.y,2.6,tl,'#F585A0');
    }
    ctx.restore();

    // 名牌
    var ty2=st==='sleep'||st==='sick'?c.y-56*s:(st==='beg'?c.y-92*s:c.y-88*s);ty2-=8;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='11px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    var nameW=ctx.measureText(c.name).width;
    var sym=c.gender==='M'?'♂':'♀';
    var symW=ctx.measureText(sym).width;
    var mark=kit?'幼':(stageOf(c.ageDays)==='elder'?'老':(c.sick?'病':''));
    if(c.personality==='grumpy')mark+=(mark?'·':'')+'😾';
    var markW=mark?ctx.measureText(mark).width+6:0;
    var pregW=c.pregnant?12:0;
    var w2=nameW+symW+markW+pregW+14;
    rr(c.x-w2/2,ty2-10,w2,20,10);
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.fill();
    ctx.strokeStyle=c.dying?'#DE6A6A':coat.base;ctx.lineWidth=1.2;ctx.stroke();
    var cx3=c.x-w2/2+8;
    ctx.textAlign='left';
    ctx.fillStyle='#4A4048';ctx.fillText(c.name,cx3,ty2+0.5);cx3+=nameW+1;
    ctx.fillStyle=c.gender==='M'?'#4C8BE0':'#E8689C';ctx.fillText(sym,cx3,ty2+0.5);cx3+=symW+3;
    if(mark){ctx.fillStyle=mark==='病'?'#DE6A6A':'#8A8090';ctx.font='9px sans-serif';ctx.fillText(mark,cx3,ty2+1);cx3+=markW;ctx.font='11px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';}
    if(c.pregnant){ctx.font='9px sans-serif';ctx.fillText('💗',cx3,ty2+1);ctx.font='11px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';}
    ctx.textAlign='start';ctx.textBaseline='alphabetic';

    // 气泡
    if(c.bubbleLife>0&&c.bubble){
      ctx.font='12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      var bw=ctx.measureText(c.bubble).width+18;
      var bx=c.x+c.dir*10,by=ty2-26;
      ctx.globalAlpha=Math.min(1,c.bubbleLife*2);
      rr(bx-bw/2,by-24,bw,21,10);
      ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx-6,by-3);ctx.lineTo(bx,by+4);ctx.lineTo(bx+6,by-3);ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();
      ctx.fillStyle='#6B5A50';ctx.textAlign='center';
      ctx.fillText(c.bubble,bx,by-13);
      ctx.textAlign='start';ctx.globalAlpha=1;
    }
  }

  /* ================= 粒子 ================= */
  function updateParticles(dt){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.life-=dt;
      if(p.life<=0){parts.splice(i,1);continue;}
      if(p.type==='heart'){p.x+=Math.sin(p.life*7)*14*dt;p.y+=p.vy*dt;}
      else if(p.type==='zzz'){p.x+=Math.sin(p.life*3)*8*dt;p.y+=p.vy*dt;}
      else{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;}
    }
  }
  function drawParticles(){
    for(var i=0;i<parts.length;i++){
      var p=parts[i],f=p.life/p.max;
      ctx.save();ctx.globalAlpha=Math.min(1,f*1.6);
      if(p.type==='heart'){ctx.translate(p.x,p.y);ctx.fillStyle='#F06292';heartPath(p.size);ctx.fill();}
      else if(p.type==='sparkle'){ctx.translate(p.x,p.y);ctx.rotate(T*3);ctx.fillStyle='#FFD86B';ctx.beginPath();ctx.moveTo(0,-p.size*2);ctx.lineTo(p.size*0.6,0);ctx.lineTo(0,p.size*2);ctx.lineTo(-p.size*0.6,0);ctx.closePath();ctx.fill();}
      else if(p.type==='crumb'){ctx.fillStyle='#B97F3F';ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();}
      else if(p.type==='zzz'){var sz=9+(1-f)*8;ctx.font='bold '+sz+'px sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(110,120,160,.9)';ctx.fillText('Z',p.x,p.y);ctx.textAlign='start';}
      else if(p.type==='text'){ctx.font='bold 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';ctx.textAlign='center';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle='#C99022';ctx.fillText(p.text,p.x,p.y);ctx.textAlign='start';}
      ctx.restore();
    }
  }

  /* ================= 主绘制 ================= */
  function draw(){
    ctx.setTransform(pxScale,0,0,pxScale,0,0);
    ctx.clearRect(0,0,LW,LH);
    ctx.save();
    ctx.translate(-Math.round(camX),0);
    drawRoom();
    var items=[];
    for(var ti=0;ti<CFG.toys.length;ti++)(function(t){items.push({y:t.id==='bed'?300:(t.id==='tree'?300:t.y+8),f:function(){drawToy(t);}});})(CFG.toys[ti]);
    items.push({y:506,f:drawBowls});
    items.push({y:508,f:drawLitter});
    items.push({y:332,f:drawGrass});
    for(var ci=0;ci<S.cats.length;ci++)(function(c){items.push({y:c.y,f:function(){drawCat(c);}});})(S.cats[ci]);
    items.sort(function(a,b){return a.y-b.y;});
    for(var ii=0;ii<items.length;ii++)items[ii].f();
    drawParticles();
    ctx.restore();
    // ---- 昼夜：白天 → 黄昏 → 夜晚 → 黎明 ----
    var dayFrac=(S.timeSec%CFG.secPerDay)/CFG.secPerDay;
    if(dayFrac>0.62){
      var dark=0.0, tint='40,50,90';
      if(dayFrac<0.76){
        dark=(dayFrac-0.62)/0.14*0.14; tint='70,52,86';
      }else if(dayFrac<0.94){
        dark=0.14+(dayFrac-0.76)/0.18*0.20; tint='34,40,74';
      }else{
        dark=0.34-(dayFrac-0.94)/0.06*0.14; tint='66,54,92';
      }
      ctx.fillStyle='rgba('+tint+','+dark.toFixed(3)+')';
      ctx.fillRect(0,0,LW,LH);
      // 室内暖灯：地面两处柔光（客厅 / 游乐室）
      if(dark>0.12){
        var glowA=Math.min(0.34,(dark-0.12)*1.05);
        var ly0C=150;
        var lamps=[[330,430,560,300],[1360,430,520,290]];
        for(var li2=0;li2<lamps.length;li2++){
          var lp=lamps[li2];
          var lpx=lp[0]-camX;
          if(lpx<-lp[2]||lpx>LW+lp[2])continue;
          // 外层宽晕：大半径、快速衰减，铺出氛围
          var g1=ctx.createRadialGradient(lpx,lp[1],30,lpx,lp[1],lp[2]);
          g1.addColorStop(0,'rgba(255,206,132,'+(glowA*0.5).toFixed(3)+')');
          g1.addColorStop(0.55,'rgba(255,196,120,'+(glowA*0.22).toFixed(3)+')');
          g1.addColorStop(1,'rgba(255,196,120,0)');
          ctx.fillStyle=g1;
          ctx.fillRect(lpx-lp[2],lp[1]-lp[3],lp[2]*2,lp[3]*2);
          // 内层暖核：小半径、更亮
          var g2=ctx.createRadialGradient(lpx,lp[1],6,lpx,lp[1],lp[2]*0.42);
          g2.addColorStop(0,'rgba(255,224,160,'+(glowA*0.75).toFixed(3)+')');
          g2.addColorStop(1,'rgba(255,224,160,0)');
          ctx.fillStyle=g2;
          ctx.fillRect(lpx-lp[2]*0.45,lp[1]-lp[3]*0.45,lp[2]*0.9,lp[3]*0.9);
          // 顶灯到地面的光锥（半透明梯形，模拟灯罩透光）
          var cone=ctx.createLinearGradient(0,ly0C,0,lp[1]);
          cone.addColorStop(0,'rgba(255,220,150,'+(glowA*0.34).toFixed(3)+')');
          cone.addColorStop(1,'rgba(255,220,150,0)');
          ctx.fillStyle=cone;
          ctx.beginPath();
          ctx.moveTo(lpx-26,ly0C+10);
          ctx.lineTo(lpx+26,ly0C+10);
          ctx.lineTo(lpx+lp[2]*0.52,lp[1]);
          ctx.lineTo(lpx-lp[2]*0.52,lp[1]);
          ctx.closePath();
          ctx.fill();
        }
        // 顶灯灯罩（夜晚亮起）——世界坐标减 camX
        var ly0C=150;
        var lampWorld=[330,1360];
        for(var lw=0;lw<lampWorld.length;lw++){
          var lx0=lampWorld[lw]-camX;
          if(lx0<-60||lx0>LW+60)continue;
          // 灯罩本体：暖黄圆角 + 顶部亮边
          ctx.fillStyle='rgba(255,232,172,.95)';
          ctx.beginPath();
          ctx.moveTo(lx0-22,ly0C-14);
          ctx.quadraticCurveTo(lx0-30,ly0C+6,lx0-26,ly0C+8);
          ctx.lineTo(lx0+26,ly0C+8);
          ctx.quadraticCurveTo(lx0+30,ly0C+6,lx0+22,ly0C-14);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle='rgba(255,255,240,.9)';
          ctx.fillRect(lx0-20,ly0C+4,40,3);
          ctx.strokeStyle='rgba(150,120,80,.55)';ctx.lineWidth=2;
          ctx.beginPath();ctx.moveTo(lx0,0);ctx.lineTo(lx0,ly0C-14);ctx.stroke();
          // 灯泡光晕（灯罩下的小亮点）
          var bulb=ctx.createRadialGradient(lx0,ly0C+9,1,lx0,ly0C+9,18);
          bulb.addColorStop(0,'rgba(255,250,220,.9)');
          bulb.addColorStop(1,'rgba(255,250,220,0)');
          ctx.fillStyle=bulb;
          ctx.fillRect(lx0-18,ly0C-9,36,36);
        }
      }
    }
    if(edgeHintT>0&&grabCat&&grabMoved){
      // 提示即将进入的房间（不是当前房间）
      var zi=Math.max(0,Math.min(2,Math.round((camX+(edgeDir>0?LW*0.5:0))/920)));
      var lbl=CFG.world.zones[zi].label;
      ctx.fillStyle='rgba(255,255,255,.9)';
      rr(LW/2-70,LH-64,140,30,15);ctx.fill();
      ctx.font='13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle='#4A4048';ctx.textAlign='center';
      ctx.fillText('→ '+lbl, LW/2, LH-44);
      ctx.textAlign='start';
    }
    if(wool.on)drawWool();
    if(fish.on)drawFish();
  }

  function buildQuestPanel(){
